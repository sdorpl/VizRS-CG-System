# Biblioteki okna Tauri na Linuksie (WebKitGTK 4.1, od Ubuntu 22.04) – wspólne dla ci.yml i release.yml.
name: Biblioteki WebKitGTK
description: Instaluje biblioteki okna vizrs-shell (apt); extra – dodatkowe pakiety
inputs:
  extra:
    description: Dodatkowe pakiety apt (np. xvfb hunspell-pl)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        EXTRA: ${{ inputs.extra }}
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev $EXTRA
