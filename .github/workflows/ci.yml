name: CI
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wspólne wektory tekstu i konwersja BTB
        shell: bash
        run: node tests/vectors/run.js && node tests/vectors/btb.js && node tests/motion.js
      - run: cargo build --release
      - name: Wersja i suma kontrolna
        shell: bash
        run: |
          ./target/release/vizrs --version
          bin=target/release/vizrs; [ -f "$bin.exe" ] && bin="$bin.exe"
          if command -v sha256sum >/dev/null; then sha256sum "$bin"; else shasum -a 256 "$bin"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: vizrs-${{ matrix.os }}
          path: |
            source/target/release/vizrs
            source/target/release/vizrs.exe
            source/target/release/vizrs-app
            source/target/release/vizrs-app.exe

  e2e:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: PLAYWRIGHT_DIR=$PWD node tests/e2e/run.js target/release/vizrs
      - run: PLAYWRIGHT_DIR=$PWD node tests/e2e/mobile.js target/release/vizrs
      - run: PLAYWRIGHT_DIR=$PWD node tests/e2e/artist.js target/release/vizrs
      - run: PLAYWRIGHT_DIR=$PWD node tests/e2e/pack.js target/release/vizrs
      - run: PLAYWRIGHT_DIR=$PWD node tests/e2e/motion.js target/release/vizrs
      - run: PLAYWRIGHT_DIR=$PWD node tests/e2e/app.js target/release/vizrs

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Budowa obrazu
        run: docker build --build-arg VIZRS_GIT_HASH=${GITHUB_SHA::7} -t vizrs:ci .
      - name: Test dymny kontenera
        run: |
          docker image ls vizrs:ci --format 'rozmiar obrazu: {{.Size}}'
          docker run -d --name vizrs-ci -p 8088:8088 -e VIZRS_TOKEN=ci-token vizrs:ci
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' vizrs-ci); echo "health: $s"
            [ "$s" = healthy ] && break; sleep 2
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' vizrs-ci)" = healthy ]
          curl -fsS -H 'X-Token: ci-token' http://127.0.0.1:8088/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/api/state)" = 401
          curl -fsS -o /dev/null 'http://127.0.0.1:8088/output?token=ci-token'
          curl -fsS -H 'X-Token: ci-token' -X POST http://127.0.0.1:8088/api/take/1001
          docker restart vizrs-ci && sleep 2
          curl -fsS -H 'X-Token: ci-token' http://127.0.0.1:8088/api/show | grep -q '"pages"'
          # bez tokenu kontener (bind 0.0.0.0) nie startuje
          ! docker run --rm vizrs:ci
          # SIGTERM obsłużony przez VizRS (PID 1 bez --init) – bez czekania 10 s na SIGKILL
          start=$(date +%s); docker stop vizrs-ci; t=$(( $(date +%s) - start )); echo "docker stop: $t s"; [ "$t" -lt 5 ]
          docker logs vizrs-ci | tail -20

  # renderer natywny vizrs-render (osobny workspace z zależnościami): testy i zgodność z Chromium na INFO24 i R7
  render:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo build --release
      - name: vizrs-render – formatowanie, clippy, testy, budowa
        working-directory: source/render
        run: cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test && cargo build --release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Zgodność z Chromium
        run: PLAYWRIGHT_DIR=$PWD node tools/native-compare.js && PLAYWRIGHT_DIR=$PWD node tools/native-compare.js ../examples/archiwum/R7_NEWS.show.json
      - uses: actions/upload-artifact@v4
        with:
          name: vizrs-render-linux
          path: source/render/target/release/vizrs-render

  # okno natywne vizrs-shell (osobny workspace z zależnościami; rdzeń vizrs bez zmian)
  shell:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: source/shell
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Biblioteki WebKitGTK (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: vizrs-shell-${{ matrix.os }}
          path: |
            source/shell/target/release/vizrs-shell
            source/shell/target/release/vizrs-shell.exe

  # okno natywne w działaniu (Linux, wirtualny ekran): cykl życia serwera i zgodność WebKitGTK z Chromium
  shell-e2e:
    needs: shell
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    env:
      GDK_BACKEND: x11
      WEBKIT_DISABLE_COMPOSITING_MODE: '1'
      WEBKIT_DISABLE_DMABUF_RENDERER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb hunspell-pl
      - run: cargo build --release
      - run: cargo build --release
        working-directory: source/shell
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: xvfb-run -a node tests/e2e/shell.js target/release/vizrs shell/target/release/vizrs-shell
      - run: PLAYWRIGHT_DIR=$PWD xvfb-run -a node tools/engines.js target/release/vizrs shell/target/release/vizrs-shell

  # okno natywne na prawdziwym Windows i macOS (Linux: shell-e2e). Windows idzie przez instalator w trybie „dla wszystkich”
  # (C:\Program Files bez prawa zapisu) i skrót bez --data – tak, jak użytkownik; wydanie 2.0.20 nie otwierało tam Trio.
  shell-smoke:
    needs: shell
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo build --release
        working-directory: source/shell
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalator (Inno Setup, z instalatorem WebView2)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: |
          # bez VCRUNTIME140.dll (statyczny CRT, source/.cargo/config.toml): czysty Windows 10 nie ma Visual C++ Redistributable
          foreach ($f in 'source/target/release/vizrs.exe', 'source/target/release/vizrs-app.exe', 'source/shell/target/release/vizrs-shell.exe') {
            $t = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($f))
            if ($t -match '(?i)vcruntime\d+\.dll|msvcp\d+\.dll') { throw "$f wymaga $($Matches[0]) (Visual C++ Redistributable)" }
            "$f – bez bibliotek Visual C++"
          }
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile deploy/windows/MicrosoftEdgeWebview2Setup.exe
          iscc /DAppVersion=0.0.0 deploy/windows/installer.iss
          $setup = Get-ChildItem dist/VizRS-Trio-*-setup.exe | Select-Object -First 1
          $p = Start-Process -Wait -PassThru $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/ALLUSERS', '/LOG=install.log'
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 40; exit 1 }
          $app = "$env:ProgramFiles\VizRS"
          foreach ($f in 'vizrs.exe', 'vizrs-shell.exe', 'serwer.bat') { if (-not (Test-Path "$app\$f")) { throw "brak $app\$f" } }
          $lnk = (New-Object -ComObject WScript.Shell).CreateShortcut("$env:ProgramData\Microsoft\Windows\Start Menu\Programs\VizRS\VizRS Trio.lnk")
          "skrót: $($lnk.TargetPath) $($lnk.Arguments)"
          if ($lnk.Arguments -ne 'trio') { throw "skrót VizRS Trio ma argumenty: $($lnk.Arguments)" }
      - name: Okno z instalacji (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: node tests/e2e/native-smoke.js "$env:ProgramFiles\VizRS\vizrs.exe" "$env:ProgramFiles\VizRS\vizrs-shell.exe" --installed
      - name: Deinstalacja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -Wait -PassThru "$env:ProgramFiles\VizRS\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          Start-Sleep 3
          if ($p.ExitCode -ne 0 -or (Test-Path "$env:ProgramFiles\VizRS\vizrs-shell.exe")) { throw 'deinstalacja nie usunęła programu' }
      - name: Okno z budowy (macOS)
        if: runner.os == 'macOS'
        run: node tests/e2e/native-smoke.js target/release/vizrs shell/target/release/vizrs-shell
