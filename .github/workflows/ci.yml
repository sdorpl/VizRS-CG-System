name: CI
# Bramka przy każdym wypchnięciu na gałąź (statusy commitów widać też w PR z tego repo) i ręcznie.
# Znaczniki nie uruchamiają CI osobno: release.yml wywołuje ten workflow (workflow_call) i publikuje dopiero po zielonym.
# Binarki z joba test (vizrs, vizrs-app) i shell (vizrs-shell) przechodzą artefaktem do e2e, render, shell-e2e i shell-smoke.
on:
  push:
    branches: ['**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: 1.65.1

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wektory tekstu, paczka .cgpack i ruch
        shell: bash
        run: node tests/vectors/run.js && node tests/cgpack.mjs && node tests/motion.js
      - run: cargo build --release
      - name: Wersja i suma kontrolna
        shell: bash
        run: |
          ./target/release/vizrs --version
          bin=target/release/vizrs; [ -f "$bin.exe" ] && bin="$bin.exe"
          if command -v sha256sum >/dev/null; then sha256sum "$bin"; else shasum -a 256 "$bin"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: vizrs-${{ matrix.os }}
          path: |
            source/target/release/vizrs
            source/target/release/vizrs.exe
            source/target/release/vizrs-app
            source/target/release/vizrs-app.exe

  zasady:
    # zasady pakietu VizRS: to repo jest źródłem; AGENTS.md = kopia CLAUDE.md (tools/sync-zasady.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # tools/check-docs.sh porównuje CHANGELOG z HEAD~1
      - run: tools/sync-zasady.sh --check
      - name: Dokumentacja stanu (CHANGELOG, STATUS)
        run: tools/check-docs.sh

  e2e:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vizrs-ubuntu-latest
          path: source/target/release
      - run: chmod +x target/release/vizrs target/release/vizrs-app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@$PLAYWRIGHT_VERSION && npx playwright install --with-deps chromium
      - run: PLAYWRIGHT_DIR=$PWD node tests/e2e/run.js target/release/vizrs
      - run: PLAYWRIGHT_DIR=$PWD node tests/e2e/mobile.js target/release/vizrs
      - run: PLAYWRIGHT_DIR=$PWD node tests/e2e/artist.js target/release/vizrs
      - run: PLAYWRIGHT_DIR=$PWD node tests/e2e/pack.js target/release/vizrs
      - run: PLAYWRIGHT_DIR=$PWD node tests/e2e/motion.js target/release/vizrs
      - run: PLAYWRIGHT_DIR=$PWD node tests/e2e/app.js target/release/vizrs
      - run: PLAYWRIGHT_DIR=$PWD node tests/e2e/panel-login.js target/release/vizrs

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Budowa obrazu
        run: docker build --build-arg VIZRS_GIT_HASH=${GITHUB_SHA::7} -t vizrs:ci .
      - name: Test dymny kontenera
        run: |
          docker image ls vizrs:ci --format 'rozmiar obrazu: {{.Size}}'
          docker run -d --name vizrs-ci -p 8088:8088 -e VIZRS_TOKEN=ci-token vizrs:ci
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' vizrs-ci); echo "health: $s"
            [ "$s" = healthy ] && break; sleep 2
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' vizrs-ci)" = healthy ]
          curl -fsS -H 'X-Token: ci-token' http://127.0.0.1:8088/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/api/state)" = 401
          curl -fsS -o /dev/null 'http://127.0.0.1:8088/output?token=ci-token'
          curl -fsS -H 'X-Token: ci-token' -X POST http://127.0.0.1:8088/api/take/1001
          docker restart vizrs-ci && sleep 2
          curl -fsS -H 'X-Token: ci-token' http://127.0.0.1:8088/api/show | grep -q '"pages"'
          # bez tokenu kontener (bind 0.0.0.0) nie startuje
          ! docker run --rm vizrs:ci
          # SIGTERM obsłużony przez VizRS (PID 1 bez --init) – bez czekania 10 s na SIGKILL
          start=$(date +%s); docker stop vizrs-ci; t=$(( $(date +%s) - start )); echo "docker stop: $t s"; [ "$t" -lt 5 ]
          docker logs vizrs-ci | tail -20

  # renderer natywny vizrs-render (osobny workspace z zależnościami): testy i zgodność z Chromium na INFO24 i R7
  render:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/render
      - uses: actions/download-artifact@v4
        with:
          name: vizrs-ubuntu-latest
          path: source/target/release
      - run: chmod +x target/release/vizrs target/release/vizrs-app
      - name: vizrs-render – formatowanie, clippy, testy, budowa
        working-directory: source/render
        run: cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test && cargo build --release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@$PLAYWRIGHT_VERSION && npx playwright install --with-deps chromium
      - name: Zgodność z Chromium
        run: PLAYWRIGHT_DIR=$PWD node tools/native-compare.js && PLAYWRIGHT_DIR=$PWD node tools/native-compare.js ../examples/archiwum/R7_NEWS.show.json
      - uses: actions/upload-artifact@v4
        with:
          name: vizrs-render-linux
          path: source/render/target/release/vizrs-render

  # okno natywne vizrs-shell (osobny workspace z zależnościami; rdzeń vizrs bez zmian)
  shell:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: source/shell
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/shell
      - name: Biblioteki WebKitGTK (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/webkit-deps
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: vizrs-shell-${{ matrix.os }}
          path: |
            source/shell/target/release/vizrs-shell
            source/shell/target/release/vizrs-shell.exe

  # okno natywne w działaniu (Linux, wirtualny ekran): cykl życia serwera i zgodność WebKitGTK z Chromium
  shell-e2e:
    needs: [test, shell]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    env:
      GDK_BACKEND: x11
      WEBKIT_DISABLE_COMPOSITING_MODE: '1'
      WEBKIT_DISABLE_DMABUF_RENDERER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/webkit-deps
        with:
          extra: xvfb hunspell-pl
      - uses: actions/download-artifact@v4
        with:
          name: vizrs-ubuntu-latest
          path: source/target/release
      - uses: actions/download-artifact@v4
        with:
          name: vizrs-shell-ubuntu-latest
          path: source/shell/target/release
      - run: chmod +x target/release/vizrs target/release/vizrs-app shell/target/release/vizrs-shell
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@$PLAYWRIGHT_VERSION && npx playwright install --with-deps chromium
      # pojedyncza instancja Tauri (tauri-plugin-single-instance) na Linuksie działa przez D-Bus sesji – w CI trzeba go uruchomić
      - run: dbus-run-session -- xvfb-run -a node tests/e2e/shell.js target/release/vizrs shell/target/release/vizrs-shell
      - run: PLAYWRIGHT_DIR=$PWD xvfb-run -a node tools/engines.js target/release/vizrs shell/target/release/vizrs-shell

  # okno natywne na prawdziwym Windows i macOS (Linux: shell-e2e). Windows idzie przez instalator w trybie „dla wszystkich”
  # i skrót bez --data – tak, jak użytkownik (deploy/windows/test-installer.ps1, ten sam test w wydaniu).
  shell-smoke:
    needs: [test, shell]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vizrs-${{ matrix.os }}
          path: source/target/release
      - uses: actions/download-artifact@v4
        with:
          name: vizrs-shell-${{ matrix.os }}
          path: source/shell/target/release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalator, okno z instalacji, deinstalacja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          deploy/windows/build-installer.ps1 -Version 0.0.0
          deploy/windows/test-installer.ps1
      - name: Okno z budowy (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x source/target/release/vizrs source/target/release/vizrs-app source/shell/target/release/vizrs-shell
          node source/tests/e2e/native-smoke.js source/target/release/vizrs source/shell/target/release/vizrs-shell
