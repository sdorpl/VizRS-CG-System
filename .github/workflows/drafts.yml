name: Usuń szkic wydania
# Ręcznie (Actions → Usuń szkic wydania → Run workflow): kasuje szkice wydań o podanej nazwie.
# Opublikowanych wydań i znaczników nie rusza.
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Nazwa szkicu (np. v2.0.6)'
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Usuń szkice
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ inputs.name }}
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.draft and .name == env.NAME) | .id')
          [ -n "$ids" ] || { echo "Brak szkicu: $NAME"; exit 0; }
          for id in $ids; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" && echo "Usunięto szkic $NAME ($id)"; done
