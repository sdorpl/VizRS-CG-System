name: Release
# Wydanie po wypchnięciu znacznika v* (np. v2.1.0) albo ręcznie (Actions → Release → Run workflow):
#   ręcznie bez `publish` – szkic; z `publish` – wydanie i znacznik na commicie z wybranej gałęzi.
#   binarki vizrs + vizrs-app + vizrs-shell: Windows (.zip), macOS (.tar.gz), Linux (.tar.gz)
#   AppImage okna Trio: VizRS-Trio-<wersja>-x86_64.AppImage (deploy/appimage/build.sh, Ubuntu 22.04)
#   .deb: pakiet Debian/Ubuntu vizrs_<wersja>_amd64.deb (deploy/deb/build.sh)
#   serwer: obraz Docker ghcr.io/<właściciel>/vizrs:v<wersja> i :latest
# Bramka: CI (ci.yml przez workflow_call) – obraz i wydanie powstają dopiero po zielonym CI tego commita.
# Wersja (bez części po łączniku) = manifesty wersji (CLAUDE.md „Tego projektu”); znacznik zawsze v<wersja>.
# Wersja z łącznikiem (v26.12.1-rc1) = wydanie wstępne. :latest tylko przy publikacji wersji bez łącznika
# (znacznik albo ręcznie z `publish`); szkic dostaje sam obraz z numerem.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Wersja (np. 2.1.0) – bez znacznika powstaje tylko szkic wydania'
        required: true
      publish:
        description: 'Opublikuj od razu: znacznik powstaje na tym commicie, szkic tej wersji jest zastępowany'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  wersja:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.w.outputs.v }}
      tag: ${{ steps.w.outputs.tag }}
      pre: ${{ steps.w.outputs.pre }}
      latest: ${{ steps.w.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
      - name: Wersja = manifesty
        id: w
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          V=${VERSION#v}; VB=${V%%-*}
          for f in source/Cargo.toml source/shell/Cargo.toml; do
            C=$(sed -n 's/^version *= *"\(.*\)"/\1/p' "$f" | head -1)
            [ "$VB" = "$C" ] || { echo "::error::wersja $VERSION ≠ $C z $f – podnieś version"; exit 1; }
          done
          T=$(sed -n 's/^ *"version": *"\(.*\)".*/\1/p' source/shell/tauri.conf.json | head -1)
          [ "$VB" = "$T" ] || { echo "::error::wersja $VERSION ≠ $T z source/shell/tauri.conf.json"; exit 1; }
          pre=false; case "$V" in *-*) pre=true;; esac
          latest=false; [ "$PUBLISH" = true ] && [ "$pre" = false ] && latest=true
          { echo "v=$V"; echo "tag=v$V"; echo "pre=$pre"; echo "latest=$latest"; } | tee -a "$GITHUB_OUTPUT"

  ci:
    uses: ./.github/workflows/ci.yml

  bin:
    needs: wersja
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x86_64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: ubuntu-22.04, name: linux-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Biblioteki WebKitGTK (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/webkit-deps
      - run: cargo build --release --locked
        working-directory: source
      - run: cargo build --release --locked
        working-directory: source/shell
      - name: Paczka
        shell: bash
        env:
          V: ${{ needs.wersja.outputs.v }}
        run: |
          v=$V; d=VizRS-$v-${{ matrix.name }}; mkdir -p dist/$d
          for f in source/target/release/vizrs source/target/release/vizrs-app source/shell/target/release/vizrs-shell; do
            for x in "$f" "$f.exe"; do [ -f "$x" ] && cp "$x" dist/$d/; done
          done
          cp README.md CHANGELOG.md dist/$d/ 2>/dev/null || true
          cp -r examples/*.cgpack dist/$d/ 2>/dev/null || true
          if [ "$RUNNER_OS" = Windows ]; then
            cp deploy/windows/*.bat dist/$d/ 2>/dev/null || true
            cp deploy/windows/README-Windows.txt dist/$d/ 2>/dev/null || true
            cp deploy/windows/vizrs.ico dist/$d/ 2>/dev/null || true
            cp deploy/install-windows-shortcuts.ps1 dist/$d/ 2>/dev/null || true
          fi
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then 7z a -tzip $d.zip $d >/dev/null; else tar czf $d.tar.gz $d; fi
          rm -rf $d; ls -la
      - name: Buduj instalator Windows (Inno Setup)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: deploy/windows/build-installer.ps1 -Version '${{ needs.wersja.outputs.v }}'
      - uses: actions/setup-node@v4
        if: matrix.os == 'windows-latest'
        with:
          node-version: 22
      - name: Instalator z wydania – instalacja, okno, deinstalacja (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: deploy/windows/test-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: dist/*

  appimage:
    needs: wersja
    runs-on: ubuntu-22.04   # starsza glibc = AppImage działa na większej liczbie dystrybucji
    env:
      V: ${{ needs.wersja.outputs.v }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/webkit-deps
      - run: cargo build --release --locked
        working-directory: source
      - run: cargo build --release --locked
        working-directory: source/shell
      - name: AppImage okna Trio
        env:
          # appimagetool to AppImage – na runnerze bez FUSE rozpakowuje się sam
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          deploy/appimage/build.sh source/target/release/vizrs source/shell/target/release/vizrs-shell "$V" dist
          rm -rf dist/appimagetool dist/*.AppDir
          ls dist/VizRS-Trio-*-x86_64.AppImage >/dev/null 2>&1 || { echo "::error::brak AppImage"; exit 1; }
          APPIMAGE_EXTRACT_AND_RUN=1 dist/VizRS-Trio-*-x86_64.AppImage --version
      - run: deploy/deb/build.sh source/target/release/vizrs source/shell/target/release/vizrs-shell "$V" dist
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            dist/*.AppImage
            dist/*.deb

  docker:
    # publikuje obraz – dopiero po zielonym CI
    needs: [wersja, ci]
    runs-on: ubuntu-latest
    env:
      # bez artefaktu „*.dockerbuild” (zapis budowy) – download-artifact w jobie release nie umiał go pobrać
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nazwa obrazu
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')/vizrs" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: VIZRS_GIT_HASH=${{ github.sha }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ needs.wersja.outputs.tag }}
            ${{ needs.wersja.outputs.latest == 'true' && format('{0}:latest', steps.img.outputs.name) || '' }}

  release:
    needs: [wersja, ci, bin, appimage, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          # tylko paczki wydania (bin-*, appimage), bez artefaktów pomocniczych innych akcji
          pattern: '{bin-*,appimage}'
          merge-multiple: true
      - name: Sumy kontrolne
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Usuń szkic tej wersji (publikacja ręczna)
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.wersja.outputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.draft and .name == \"$TAG\") | .id" |
            xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/{}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.wersja.outputs.tag }}
          # znacznik tworzony przy publikacji wskazuje zbudowany commit, nie gałąź domyślną
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
          prerelease: ${{ needs.wersja.outputs.pre == 'true' }}
          make_latest: ${{ needs.wersja.outputs.latest }}
          generate_release_notes: true
          files: dist/*
          body: |
            **Serwer (Docker):** `docker run -d -p 8088:8088 -e VIZRS_TOKEN=TWOJ_TOKEN -v vizrs-data:/data ghcr.io/${{ github.repository_owner }}/vizrs:${{ needs.wersja.outputs.tag }}`
            **Linux:** `VizRS-Trio-*.AppImage` (wymaga WebKitGTK 4.1, bez niego okno Chromium; dane w `~/.local/share/vizrs`).
            **Debian / Ubuntu (22.04+):** `sudo apt install ./vizrs_*_amd64.deb` – okna Trio i „Trio – serwer zdalny” w menu, usługa `vizrs` (wyłączona).
            **Windows:** `VizRS-Trio-*-windows-x86_64-setup.exe` (instalator) lub archiwum przenośne `.zip` z launcherami `.bat`.
            **Projektowanie scen:** osobny program [VizRS CG Artist](https://github.com/sdorpl/VizRS-CG-Artist/releases) (Linux, Windows, macOS); `/artist` serwera – zamrożony zapas w przeglądarce.
            **Windows / macOS / Linux:** archiwum z `vizrs`, `vizrs-app`, `vizrs-shell`.
