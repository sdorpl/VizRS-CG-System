name: Release
# Wydanie po wypchnięciu znacznika v* (np. v2.1.0) albo ręcznie (Actions → Release → Run workflow):
#   ręcznie bez `publish` – szkic; z `publish` – wydanie i znacznik na commicie z wybranej gałęzi.
#   binarki vizrs + vizrs-app + vizrs-shell: Windows (.zip), macOS (.tar.gz), Linux (.tar.gz)
#   AppImage: budowane LOKALNIE (deploy/appimage/build.sh) i dołączane do wydania `gh release upload` – CI ich nie buduje
#   .deb: pakiet Debian/Ubuntu vizrs_<wersja>_amd64.deb (deploy/deb/build.sh)
#   serwer: obraz Docker ghcr.io/<właściciel>/vizrs:<wersja> i :latest
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Wersja (np. 2.1.0) – bez znacznika powstaje tylko szkic wydania'
        required: true
      publish:
        description: 'Opublikuj od razu: znacznik powstaje na tym commicie, szkic tej wersji jest zastępowany'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  bin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x86_64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: ubuntu-22.04, name: linux-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Biblioteki WebKitGTK (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev
      - run: cargo build --release --locked
        working-directory: source
      - run: cargo build --release --locked
        working-directory: source/shell
      - name: Paczka
        shell: bash
        run: |
          v=${VERSION#v}; d=VizRS-$v-${{ matrix.name }}; mkdir -p dist/$d
          for f in source/target/release/vizrs source/target/release/vizrs-app source/shell/target/release/vizrs-shell; do
            for x in "$f" "$f.exe"; do [ -f "$x" ] && cp "$x" dist/$d/; done
          done
          cp README.md CHANGELOG.md dist/$d/ 2>/dev/null || true
          cp -r examples/*.cgpack dist/$d/ 2>/dev/null || true
          if [ "$RUNNER_OS" = Windows ]; then
            cp deploy/windows/*.bat dist/$d/ 2>/dev/null || true
            cp deploy/windows/README-Windows.txt dist/$d/ 2>/dev/null || true
            cp deploy/windows/vizrs.ico dist/$d/ 2>/dev/null || true
            cp deploy/install-windows-shortcuts.ps1 dist/$d/ 2>/dev/null || true
          fi
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then 7z a -tzip $d.zip $d >/dev/null; else tar czf $d.tar.gz $d; fi
          rm -rf $d; ls -la
      - name: Buduj instalator Windows (Inno Setup)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # bez VCRUNTIME140.dll (statyczny CRT, source/.cargo/config.toml): czysty Windows 10 nie ma Visual C++ Redistributable
          foreach ($f in 'source/target/release/vizrs.exe', 'source/target/release/vizrs-app.exe', 'source/shell/target/release/vizrs-shell.exe') {
            $t = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($f))
            if ($t -match '(?i)vcruntime\d+\.dll|msvcp\d+\.dll') { throw "$f wymaga $($Matches[0]) (Visual C++ Redistributable)" }
            "$f – bez bibliotek Visual C++"
          }
          $v = "${{ env.VERSION }}".TrimStart('v')
          if (-not $v) { $v = "2.0.2" }
          # instalator Evergreen WebView2 Runtime (Microsoft) – instalator VizRS uruchamia go, gdy w systemie brak WebView2
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile deploy/windows/MicrosoftEdgeWebview2Setup.exe
          iscc "/DAppVersion=$v" deploy/windows/installer.iss
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: dist/*

  appimage:
    runs-on: ubuntu-22.04   # starsza glibc = AppImage działa na większej liczbie dystrybucji
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev
      - run: cargo build --release --locked
        working-directory: source
      - run: cargo build --release --locked
        working-directory: source/shell
      - run: deploy/deb/build.sh source/target/release/vizrs source/shell/target/release/vizrs-shell "${VERSION#v}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.deb

  docker:
    runs-on: ubuntu-latest
    env:
      # bez artefaktu „*.dockerbuild” (zapis budowy) – download-artifact w jobie release nie umiał go pobrać
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nazwa obrazu
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')/vizrs" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: VIZRS_GIT_HASH=${{ github.sha }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ env.VERSION }}
            ${{ steps.img.outputs.name }}:latest

  release:
    needs: [bin, appimage, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          # tylko paczki wydania (bin-*, appimage), bez artefaktów pomocniczych innych akcji
          pattern: '{bin-*,appimage}'
          merge-multiple: true
      - name: Sumy kontrolne
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Usuń szkic tej wersji (publikacja ręczna)
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.draft and .name == \"$VERSION\") | .id" |
            xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/{}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          # znacznik tworzony przy publikacji wskazuje zbudowany commit, nie gałąź domyślną
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
          make_latest: ${{ github.event_name == 'push' || inputs.publish }}
          generate_release_notes: true
          files: dist/*
          body: |
            **Serwer (Docker):** `docker run -d -p 8088:8088 -e VIZRS_TOKEN=TWOJ_TOKEN -v vizrs-data:/data ghcr.io/${{ github.repository_owner }}/vizrs:${{ env.VERSION }}`
            **Linux:** `VizRS-Trio-*.AppImage` – dołączane po budowie lokalnej (sumy: `SHA256SUMS-AppImage.txt`; wymaga WebKitGTK 4.1, bez niego okno Chromium; dane w `~/.local/share/vizrs`).
            **Debian / Ubuntu (22.04+):** `sudo apt install ./vizrs_*_amd64.deb` – okna Trio i „Trio – serwer zdalny” w menu, usługa `vizrs` (wyłączona).
            **Windows:** `VizRS-Trio-*-windows-x86_64-setup.exe` (instalator) lub archiwum przenośne `.zip` z launcherami `.bat`.
            **Projektowanie scen:** osobny program [VizRS CG Artist](https://github.com/sdorpl/VizRS-CG-Artist/releases) (Linux, Windows, macOS); `/artist` serwera – zamrożony zapas w przeglądarce.
            **Windows / macOS / Linux:** archiwum z `vizrs`, `vizrs-app`, `vizrs-shell`.
