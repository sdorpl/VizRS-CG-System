<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>VizRS Trio</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0f">
<link rel="manifest" href="/trio.webmanifest">
<style>
  html, body { margin: 0; height: 100%; background: radial-gradient(900px 400px at 50% -10%, rgba(245, 165, 36, .07), transparent 60%), #0e1015; color: #e4e7ee; font: 16px/1.4 "Inter", system-ui, sans-serif; color-scheme: dark; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
  form { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; visibility: hidden; }
  img { width: 72px; height: 72px; border-radius: 16px; align-self: center; }
  h1 { font-size: 20px; margin: 0; text-align: center; }
  input, button { font: inherit; padding: 13px; border-radius: 10px; border: 1px solid #262c37; box-sizing: border-box; width: 100%; }
  input { background: #0b0d11; color: inherit; outline: none; }
  input:focus { border-color: #c47d0e; box-shadow: 0 0 0 3px rgba(245, 165, 36, .28); }
  button { background: linear-gradient(180deg, #ffbb4a, #f5a524); border-color: #f5a524; color: #1a1100; font-weight: 700; box-shadow: 0 4px 14px rgba(245, 165, 36, .18); }
  #bad { color: #ff8f8a; text-align: center; }
</style>
</head>
<body>
<form action="/trio" method="get">
  <img src="/trio-icon.svg" alt="">
  <h1>VizRS Trio</h1>
  <div id="bad" hidden>Zły token.</div>
  <input name="token" type="password" placeholder="token serwera" autocomplete="current-password" required autofocus>
  <button>Połącz</button>
</form>
<script>
// Ciasteczko SameSite=Strict nie jedzie z pierwszym wejściem z ikony; żądanie z tej strony już je ma, więc zalogowany telefon przechodzi od razu.
const params = new URLSearchParams(location.search);
document.getElementById('bad').hidden = !params.has('token');
fetch('/api/state').then((r) => { if (r.ok && !params.has('token')) location.replace('/trio' + location.search); else document.querySelector('form').style.visibility = 'visible'; })
  .catch(() => { document.querySelector('form').style.visibility = 'visible'; });
</script>
</body>
</html>
