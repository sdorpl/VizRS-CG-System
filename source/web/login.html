<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>VizRS Trio</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0f">
<link rel="manifest" href="/trio.webmanifest">
<style>
  html, body { margin: 0; height: 100%; background: radial-gradient(900px 400px at 50% -10%, rgba(245, 165, 36, .07), transparent 60%), #0e1015; color: #e4e7ee; font: 16px/1.4 "Inter", system-ui, sans-serif; color-scheme: dark; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
  #box { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; visibility: hidden; }
  form { display: flex; flex-direction: column; gap: 12px; }
  img { width: 72px; height: 72px; border-radius: 16px; align-self: center; }
  h1 { font-size: 20px; margin: 0; text-align: center; }
  input, button { font: inherit; padding: 13px; border-radius: 10px; border: 1px solid #262c37; box-sizing: border-box; width: 100%; }
  input { background: #0b0d11; color: inherit; outline: none; }
  input:focus { border-color: #c47d0e; box-shadow: 0 0 0 3px rgba(245, 165, 36, .28); }
  button { background: linear-gradient(180deg, #ffbb4a, #f5a524); border-color: #f5a524; color: #1a1100; font-weight: 700; box-shadow: 0 4px 14px rgba(245, 165, 36, .18); }
  #bad, #acc-bad { color: #ff8f8a; text-align: center; }
  .or { color: #8a93a6; font-size: 13px; text-align: center; margin: 4px 0 -4px; }
  #acc { display: flex; flex-direction: column; gap: 12px; }
  #acc[hidden], #bad[hidden], #acc-bad[hidden] { display: none; }
</style>
</head>
<body>
<div id="box">
  <img src="/trio-icon.svg" alt="">
  <h1 id="title">VizRS Trio</h1>
  <div id="acc" hidden>
    <div id="acc-bad" hidden></div>
    <input id="acc-user" type="text" placeholder="login (konto panelu VizRS CG Playout)" autocomplete="username" autocapitalize="none" spellcheck="false">
    <input id="acc-pass" type="password" placeholder="hasło" autocomplete="current-password">
    <button id="acc-go" type="button">Zaloguj</button>
    <div class="or">albo token serwera</div>
  </div>
  <form id="tok" action="/trio" method="get">
    <div id="bad" hidden>Zły token.</div>
    <input id="token" name="token" type="password" placeholder="token serwera" autocomplete="current-password" autofocus>
    <button>Połącz</button>
  </form>
</div>
<script>
// Ciasteczko SameSite=Strict nie jedzie z pierwszym wejściem z ikony; żądanie z tej strony już je ma, więc zalogowany telefon przechodzi od razu.
const params = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
const form = $('tok');
// ten sam ekran dla /trio i /artist – wracamy tam, skąd przyszedł
form.action = location.pathname;
if (location.pathname === '/artist') { $('title').textContent = 'VizRS Artist'; document.title = 'VizRS Artist'; }
$('bad').hidden = !params.has('token');
form.addEventListener('submit', (e) => { if (!$('token').value) e.preventDefault(); });
// konta panelu VizRS CG Playout (opcja serwera --panel-login, przełącznik w panelu)
async function accountLogin() {
  const bad = $('acc-bad');
  bad.hidden = true;
  try {
    const r = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user: $('acc-user').value.trim(), password: $('acc-pass').value }) });
    if (r.ok) { location.replace(location.pathname + location.search.replace(/([?&])token=[^&]*&?/, '$1').replace(/[?&]$/, '')); return; }
    bad.textContent = (await r.json().catch(() => ({}))).error || `błąd ${r.status}`;
  } catch { bad.textContent = 'brak połączenia z serwerem'; }
  bad.hidden = false;
}
$('acc-go').addEventListener('click', accountLogin);
$('acc-pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); accountLogin(); } });
fetch('/login/info').then((r) => r.json()).then((d) => {
  if (!d.panel) return;
  $('acc').hidden = false;
  if (!params.has('token')) $('acc-user').focus();
}).catch(() => {});
fetch('/api/state').then((r) => { if (r.ok && !params.has('token')) location.replace(location.pathname + location.search); else $('box').style.visibility = 'visible'; })
  .catch(() => { $('box').style.visibility = 'visible'; });
</script>
</body>
</html>
