<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>VizRS Artist</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>if (window.__vizrsShell) document.documentElement.classList.add('native');</script>
<link rel="stylesheet" href="/ui.css">
<style>
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  #main { flex: 1; display: grid; grid-template-columns: var(--l, 270px) 4px minmax(240px, 1fr) 4px var(--r, 350px); grid-template-rows: minmax(160px, 1fr) 4px var(--t, 260px); min-height: 0; background: #0b0c0e; }
  #treeP { grid-area: 1 / 1 / 2 / 2; }
  #gL { grid-area: 1 / 2 / 2 / 3; cursor: col-resize; }
  #canvasP { grid-area: 1 / 3 / 2 / 4; }
  #gR { grid-area: 1 / 4 / 4 / 5; cursor: col-resize; }
  #propsP { grid-area: 1 / 5 / 4 / 6; }
  #gT { grid-area: 2 / 1 / 3 / 4; cursor: row-resize; }
  #timeP { grid-area: 3 / 1 / 4 / 4; }
  /* panele zadokowane jak w programie desktopowym: bez zaokrągleń i odstępów, rozdzielacze do przeciągania */
  #main > .panel { border-radius: 0; border: none; }
  #main > .panel > header { min-height: 30px; padding: 3px 6px; }
  .gutter { background: #0b0c0e; touch-action: none; }
  .gutter:hover, .gutter.drag { background: var(--acc-d); }
  .topbar { padding: 4px 8px; gap: 6px; }
  #box { position: relative; flex: 1; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; outline: 1px solid #3a3f48; }
  #stage .vz-node { cursor: move; }
  #stage .vz-node[data-over] { outline: 2px dashed #ff4d4d; outline-offset: 2px; }
  .sqinfo { padding: 0 10px 4px 110px; font: 11px ui-monospace, monospace; color: #8b93a1; display: flex; flex-wrap: wrap; gap: 8px; }
  .sqinfo .warn { color: #ffb020; } .sqinfo .bad { color: #ff4d4d; }
  #sel { position: absolute; border: 1px solid var(--acc); pointer-events: none; box-shadow: 0 0 0 1px rgba(0,0,0,.6); display: none; z-index: 5; }
  #sel .h { position: absolute; right: -6px; bottom: -6px; width: 11px; height: 11px; background: var(--acc); border: 1px solid #000; pointer-events: auto; cursor: nwse-resize; }
  #sel .lbl { position: absolute; left: -1px; top: -18px; font-size: 10px; background: var(--acc); color: #000; padding: 1px 4px; white-space: nowrap; }
  #safe { position: absolute; pointer-events: none; display: none; z-index: 4; }
  #safe div { position: absolute; border: 1px dashed rgba(255,255,255,.3); }
  #info { position: absolute; left: 8px; bottom: 6px; font-size: 11px; color: var(--dim); z-index: 6; pointer-events: none; }
  #tree .item { padding-top: 4px; padding-bottom: 4px; }
  #tree .ic { width: 16px; text-align: center; color: var(--acc); }
  #tree .item.hid span:not(.eye) { opacity: .4; }
  #tree .eye { opacity: .5; font-size: 11px; padding: 0 3px; }
  #tree .eye:hover { opacity: 1; }
  .pill.fld { background: #1b3157; border-color: var(--blue); color: #a9c8ff; }
  #props .phead { display: flex; gap: 6px; align-items: center; padding: 8px; border-bottom: 1px solid var(--line); }
  #props .phead .ic { color: var(--acc); font-size: 16px; }
  .pgroup { padding: 8px 8px 3px; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--acc); opacity: .8; }
  .pr { display: grid; grid-template-columns: 100px 1fr 24px 24px; gap: 4px; align-items: center; padding: 2px 8px; }
  .pr label { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pr label[data-scrub]:not([data-scrub=""]) { cursor: ew-resize; }
  .pr .pin input:not([type=checkbox]):not([type=color]), .pr .pin select, .pr .pin textarea { width: 100%; }
  .kbtn { color: #555b66; font-size: 11px; }
  .kbtn.has { color: var(--acc); }
  .kbtn.on { background: var(--acc); color: #1a1100; border-color: var(--acc); }
  .fbtn { color: #555b66; font-size: 11px; }
  .fbtn.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  .sp { display: grid; grid-template-columns: 110px 1fr; gap: 6px; align-items: center; padding: 3px 10px; }
  .sp input, .sp select { width: 100%; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { background: #3a1716; border: 1px solid var(--red); color: #ffb0ad; border-radius: 10px; padding: 0 4px 0 8px; font-size: 12px; display: inline-flex; gap: 4px; align-items: center; }
  .chip button { padding: 0 4px; border: none; background: none; color: inherit; }
  .mo { display: grid; grid-template-columns: 62px 1fr 1fr; gap: 4px; align-items: center; padding: 2px 8px; }
  .mo .sub { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; grid-column: 2 / 4; }
  .mo .sub label { font-size: 10px; color: var(--dim); display: flex; flex-direction: column; gap: 1px; }
  .mo .sub input, .mo .sub select { width: 100%; min-width: 0; }
  .mohint { padding: 2px 10px 4px; font-size: 11px; color: var(--warn, #e8b04b); }
  .help { padding: 10px; color: var(--dim); font-size: 12px; line-height: 1.5; border-top: 1px solid var(--line); margin-top: 8px; }
  .ftable { width: 100%; border-collapse: collapse; font-size: 12px; }
  .ftable td { padding: 3px 6px; border-bottom: 1px solid #23262c; }
  .ftable input { width: 100%; }
  .rules { display: grid; grid-template-columns: 150px 1fr; gap: 4px 8px; padding: 6px 4px 8px; background: #17191d; border-radius: 4px; align-items: center; }
  .rules .rchks { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .rules .rchk { display: flex; align-items: center; gap: 4px; color: var(--text); }
  .rules input[type=checkbox] { width: auto; }
  /* timeline */
  #tl { position: relative; overflow: auto; flex: 1; user-select: none; }
  .tl-in { position: relative; min-height: 100%; }
  .tl-row { display: flex; height: 22px; border-bottom: 1px solid #22252a; }
  .tl-row.sel { background: #1c2533; }
  .tl-row.ruler { position: sticky; top: 0; z-index: 3; background: #1d2024; height: 24px; border-bottom: 1px solid var(--line); }
  .tl-lbl { position: sticky; left: 0; z-index: 2; width: 190px; min-width: 190px; padding: 0 8px; display: flex; align-items: center; gap: 4px; background: var(--panel); border-right: 1px solid var(--line); font-size: 12px; overflow: hidden; white-space: nowrap; cursor: pointer; }
  .tl-row.sel .tl-lbl { background: #1c2533; }
  .tl-row.ruler .tl-lbl { background: #1d2024; cursor: default; z-index: 4; }
  .tl-area { position: relative; flex: none; cursor: text; }
  .tick { position: absolute; top: 14px; bottom: 0; border-left: 1px solid #3a3f48; font-size: 10px; color: var(--dim); }
  .tick.maj { top: 4px; border-color: #59606d; padding-left: 3px; }
  .mkm { position: absolute; top: 12px; transform: translateX(-4px); color: #5fd4a0; font-size: 9px; cursor: pointer; line-height: 1; white-space: nowrap; z-index: 2; }
  .mkm span { font-size: 10px; margin-left: 2px; color: #9bdcc0; }
  #band { position: absolute; border: 1px dashed var(--acc); background: rgba(240,160,32,.12); z-index: 6; pointer-events: none; }
  #tree .item.dropinto { outline: 2px solid var(--acc); outline-offset: -2px; }
  #tree .item.dropafter { box-shadow: 0 2px 0 var(--acc); }
  .stopm { position: absolute; top: 2px; transform: translateX(-6px); color: var(--red); font-size: 12px; cursor: ew-resize; line-height: 1; }
  .endm { position: absolute; top: 0; bottom: 0; border-left: 2px solid #59606d; }
  .stopline { position: absolute; top: 24px; bottom: 0; border-left: 1px dashed rgba(229,50,45,.55); pointer-events: none; z-index: 1; }
  .endline { position: absolute; top: 24px; bottom: 0; border-left: 1px solid #59606d; pointer-events: none; }
  #playhead { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid var(--acc); pointer-events: none; z-index: 5; }
  .kf { position: absolute; top: 5px; width: 11px; height: 11px; margin-left: -5px; background: #c9ced8; transform: rotate(45deg); cursor: ew-resize; border: 1px solid #000; z-index: 2; }
  .kf.sel { background: var(--acc); }
  .seg { position: absolute; top: 9px; height: 3px; background: #4b5a74; border-radius: 2px; }
  .seg.hold { background: #2f343c; }
  .tl-row.seq { height: 26px; }
  .mb { position: absolute; top: 3px; height: 12px; border-radius: 3px; background: #2f6fd6; color: #fff; font-size: 9px; line-height: 12px; padding: 0 4px; overflow: hidden; white-space: nowrap; cursor: grab; z-index: 2; box-sizing: border-box; min-width: 4px; }
  .mb.out { background: #b4532a; }
  .mb.tin, .mb.tout { top: 16px; height: 7px; font-size: 0; background: #6d8fd8; }
  .mb.tout { background: #d08a5f; }
  .mb.loop { top: 3px; height: 20px; background: repeating-linear-gradient(135deg, rgba(232,176,75,.22) 0 6px, transparent 6px 12px); color: #e8b04b; cursor: default; z-index: 1; line-height: 20px; }
  .mb .mbh { position: absolute; right: 0; top: 0; bottom: 0; width: 6px; cursor: ew-resize; background: rgba(255,255,255,.35); }
  .mb.sel { outline: 1px solid #fff; }
  #seqMode.on { background: var(--acc); color: #000; }
  /* narzędzia trybu sekwencji – pasek kontekstowy pod paskiem osi czasu */
  #seqTools { display: none; gap: 4px; align-items: center; padding: 3px 8px; background: #1d2024; border-bottom: 1px solid var(--line); flex: none; }
  #timeP header > input, #timeP header > button { flex: none; }
  #timeP > header { flex-wrap: wrap; row-gap: 3px; gap: 4px; }
  #timeP > header label { font-size: 12px; }
  body.seq #seqTools { display: flex; }
  body.seq #keyed, body.seq #keyCopy, body.seq #keyPaste { display: none; }
  /* pasek zaznaczonego klucza – stały (bez przeskakiwania osi czasu); w trybie sekwencji w tym miejscu są narzędzia sekwencji */
  #keyed, #seqTools { min-height: 30px; }
  #keyed { display: flex; gap: 6px; align-items: center; padding: 3px 8px; background: #1d2024; border-bottom: 1px solid var(--line); flex: none; }
  #keyed input { width: 72px; }
  #keyed select { width: 90px; }
  #tc { width: 76px; font-family: var(--mono); text-align: right; }
  .sep { width: 1px; height: 20px; background: var(--line); margin: 0 2px; }
  .dirty::after { content: ' ●'; color: var(--acc); }
  .empty { padding: 30px; text-align: center; color: var(--dim); }
  .prtk { padding: 4px 8px; }
  .prtk .prtk-h { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 3px; }
  .prtk .tkx-row { grid-template-columns: 18px 8px minmax(52px, 80px) 1fr auto auto auto auto; gap: 3px; }
  .prtk .tkx-txt { font-size: 13px; padding: 2px 4px; }
</style>
</head>
<body>
<div class="topbar tb">
  <span class="brand">Viz<b>RS</b> Artist</span>
  <nav><a href="/artist" class="on">Artist</a><a href="/trio">Trio</a><a href="/output?checker=1&status=1" target="_blank">Wyjście ↗</a></nav>
  <span class="sep navsep"></span>
  <label>Scena</label>
  <select id="sceneSel" style="min-width:180px"></select>
  <button id="bNew" title="Nowa scena">＋ Nowa</button>
  <button id="bDup" title="Duplikuj scenę">⧉</button>
  <button id="bDel" class="icon danger" title="Usuń scenę"><i class="ico del"></i></button>
  <button id="bExp" title="Eksport sceny do pliku JSON">⇩ Eksport</button>
  <button id="bPack" title="Paczka belek .cgpack: wybrane sceny + strony + grafiki + czcionki w jednym pliku">⇩ Paczka</button>
  <button id="bImp" title="Import sceny (.json) albo paczki belek (.cgpack)">⇧ Import</button>
    <button id="bImpBtb" title="Importuj element z BTB CG (.json eksport v3 lub .cgpack) jako scenę + stronę">⇧ BTB</button>
  <span class="grow"></span>
  <button id="bUndo" title="Cofnij (Ctrl+Z)">↶</button>
  <button id="bRedo" title="Ponów (Ctrl+Y)">↷</button>
  <button id="bSafe" title="Pokaż obszary bezpieczne">▢ Safe</button>
  <button id="bSave" class="acc" title="Zapisz (Ctrl+S)">Zapisz</button>
</div>

<div id="main">
  <section class="panel" id="treeP" data-hint="Drzewo sceny: niżej na liście = wyżej na ekranie · przeciągnij, aby zmienić kolejność lub rodzica · Ctrl+D duplikuj · Del usuń">
    <header>
      <h3>Drzewo sceny</h3>
      <select id="addSel" title="Dodaj kontener"><option value="">＋ Dodaj…</option></select>
    </header>
    <div class="row tb" style="padding:3px 4px;gap:2px;border-bottom:1px solid var(--line)">
      <button class="icon" id="tUp" title="W górę (pod spód)">↑</button>
      <button class="icon" id="tDown" title="W dół (na wierzch)">↓</button>
      <button class="icon" id="tOut" title="Wyjmij z grupy">⇤</button>
      <button class="icon" id="tIn" title="Włóż do poprzedniej grupy">⇥</button>
      <button class="icon" id="tDupN" title="Duplikuj (Ctrl+D)">⧉</button>
      <span class="grow"></span>
      <button class="icon danger" id="tDel" title="Usuń (Del)"><i class="ico del"></i></button>
    </div>
    <div class="scroll list" id="tree"></div>
  </section>
  <div class="gutter" id="gL" data-k="l" title="Przeciągnij, aby zmienić szerokość (dwuklik = domyślna)"></div>

  <section class="panel" id="canvasP" data-hint="Kanwa: przeciągnij element · róg = rozmiar · strzałki = 1 px (Shift = 10 px) · klik w puste miejsce = ustawienia sceny">
    <div id="box" class="checker">
      <div id="stage"></div>
      <div id="safe"><div style="inset:5%"></div><div style="inset:10%"></div></div>
      <div id="sel"><span class="lbl"></span><div class="h"></div></div>
      <div id="info"></div>
    </div>
  </section>

  <div class="gutter" id="gR" data-k="r" title="Przeciągnij, aby zmienić szerokość (dwuklik = domyślna)"></div>
  <section class="panel" id="propsP" data-hint="Właściwości: przeciągnij nazwę w poziomie = zmiana wartości · ◆ = klucz animacji w bieżącym czasie · łańcuch = pole kontrolne w Trio">
    <header><h3 id="propsTitle">Właściwości</h3></header>
    <div class="scroll" id="props"></div>
  </section>

  <div class="gutter" id="gT" data-k="t" title="Przeciągnij, aby zmienić wysokość osi czasu (dwuklik = domyślna)"></div>
  <section class="panel" id="timeP" data-hint="Oś czasu: dwuklik na ścieżce = nowy klucz · ramka = zaznaczenie kluczy · M = marker · Spacja = odtwórz · Home/End = początek/koniec">
    <header class="tb">
      <input id="tc" title="Czas (s)">
      <button class="icon" id="pHome" title="Na początek (Home)">⏮</button>
      <button id="pTake" title="Odtwórz IN: 0 → pierwszy stop">▶ Take</button>
      <button id="pCont" title="Do następnego stopu">⏭ Continue</button>
      <button id="pOut" title="Od ostatniego stopu do końca">⏏ Out</button>
      <button class="icon" id="pPlay" title="Odtwórz całość (Spacja)">▶</button>
      <button class="icon" id="pStop" title="Pauza">⏸</button>
      <span class="sep"></span>
      <button id="addStop" title="Dodaj stop point w bieżącym czasie">＋ Stop</button>
      <label title="Długość sceny (s)">Dł.</label><input id="dur" type="number" step="0.1" min="0.1" style="width:60px" title="Długość sceny (s)">
      <span class="grow"></span>
      <button id="seqMode" title="Prosty tryb sekwencji (jak „Ruch” w BTB CG Editor): paski wejścia, efektu tekstu, pętli i wyjścia każdego elementu – przeciągnij, aby zmienić opóźnienie, krawędź – czas">≣ Sekwencja</button>
      <button id="markAdd" class="icon" title="Dodaj marker w bieżącym czasie (M)">▾</button>
      <button id="keyCopy" class="icon" title="Kopiuj zaznaczone klucze (Ctrl+C na osi czasu)">⧉</button>
      <button id="keyPaste" class="icon" title="Wklej klucze w bieżącym czasie na zaznaczony węzeł (Ctrl+V)">⎘</button>
      <input id="zoom" type="range" min="40" max="1200" value="320" style="width:80px" title="Powiększenie osi czasu"><button id="zoomFit" class="icon" title="Dopasuj oś czasu do szerokości">↔</button>
    </header>
    <div id="seqTools" class="tb"><span class="dim" style="font-size:11px">SEKWENCJA</span>
      <label title="Odstęp kaskady">krok</label><input id="seqStep" type="number" step="0.05" min="0" value="0.1" style="width:52px">
      <button data-seq="stagger" title="Kaskada: wejścia elementów jedno po drugim co „krok” (wyjścia w odwrotnej kolejności). Dotyczy dzieci zaznaczonej grupy, rodzeństwa zaznaczonego elementu albo całej sceny">⇶ Kaskada</button>
      <button data-seq="chain" title="Po kolei: każdy element wchodzi po zakończeniu wejścia poprzedniego (powiązanie „po węźle”)">↳ Po kolei</button>
      <button data-seq="copy" title="Kopiuj ruch zaznaczonego elementu na jego rodzeństwo">⧉ Kopiuj ruch</button>
      <button data-seq="keys" title="Zamień presety wejścia/wyjścia zaznaczonego elementu na klucze (pętle i efekty tekstu zostają)">◆ Na klucze</button>
      <button data-seq="clear" class="danger" title="Usuń ruch (presety) z zaznaczonego elementu albo całej grupy">✕ Usuń ruch</button>
      <button data-seq="fit" title="Stop point po wejściu, długość = stop + wyjście">⟲ Dopasuj</button>
    </div>
    <div id="keyed" class="tb" title="Zaznaczony klucz animacji"></div>
    <div id="tl"></div>
  </section>
</div>
<footer class="statusbar" id="statusbar"><span class="hint" id="hint"></span><span class="grow"></span><span id="conn" class="pill" title="Połączenie z serwerem VizRS">łączenie…</span></footer>
<datalist id="fontlist"></datalist>
<datalist id="nodelist"></datalist>
<datalist id="layerlist"><option>back</option><option>main</option><option>front</option></datalist>
<input type="file" id="fileIn" hidden>

<script type="module">
import * as BTB from '/btb-io.js';
import * as PACK from '/cgpack.js';
import * as MO from '/motion.js';
import { PROPS, TYPES, FONTS, EASES, ScenePlayer, propAt, walk, listFields, variantFields, uid, fitStage, parseColor, connectEvents } from '/renderer.js';
import { mountTickerEditor } from '/ticker-items.js';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: body !== undefined ? { 'Content-Type': 'application/json' } : {}, body: body !== undefined ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
let toastT;
function toast(msg, err) {
  let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg; el.classList.toggle('err', !!err); el.style.opacity = 1;
  clearTimeout(toastT); toastT = setTimeout(() => (el.style.opacity = 0), 2600);
}

// ------------------------------------------------------------ stan
let scenes = [], scene = null, selId = null, t = 0, player = null, dirty = false;
let undo = [], redo = [], selKey = null, selKeys = [], clipKeys = null, pps = 320, assets = [], scale = 1, lastArea = 'canvas', pendingCP = false;
const LBL = 190;
const stage = $('#stage'), box = $('#box');

$('#fontlist').innerHTML = FONTS.map((f) => `<option>${f}</option>`).join('');
$('#addSel').innerHTML += Object.entries(TYPES).map(([k, v]) => `<option value="${k}">${v.icon} ${v.label}</option>`).join('');

function setDirty(d) { dirty = d; $('#bSave').classList.toggle('dirty', d); }
function checkpoint() {
  undo.push(JSON.stringify(scene)); if (undo.length > 150) undo.shift();
  redo = []; setDirty(true);
}
function restore(json) {
  scene = JSON.parse(json);
  if (selId && !locate(selId)) selId = null;
  selKey = null; selKeys = [];
  player.setScene(scene); player.seek(t);
  renderAll(); setDirty(true);
}
function doUndo() { if (!undo.length) return; redo.push(JSON.stringify(scene)); restore(undo.pop()); }
function doRedo() { if (!redo.length) return; undo.push(JSON.stringify(scene)); restore(redo.pop()); }

function locate(id, nodes = scene.nodes, parent = null) {
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    if (n.id === id) return { node: n, list: nodes, index: i, parent };
    if (n.children) { const r = locate(id, n.children, n); if (r) return r; }
  }
  return null;
}
const selNode = () => (selId ? locate(selId)?.node : null);

// ------------------------------------------------------------ ładowanie
async function loadAssets() { assets = await api('GET', '/api/assets').catch(() => []); updateFontList(); }
function updateFontList() {
  const af = assets.filter((a) => /\.(ttf|otf|woff2?)$/i.test(a.name)).map((a) => a.name);
  $('#fontlist').innerHTML = [...FONTS, ...af].map((f) => `<option>${esc(f)}</option>`).join('');
}
async function load() {
  const show = await api('GET', '/api/show');
  scenes = show.scenes;
  await loadAssets();
  const want = new URLSearchParams(location.search).get('scene');
  const s = scenes.find((s) => s.id === want) || scenes[0];
  if (s) openScene(s); else newScene('Nowa scena');
}
function renderSceneSel() {
  $('#sceneSel').innerHTML = scenes.map((s) => `<option value="${s.id}" ${scene && s.id === scene.id ? 'selected' : ''}>${esc(s.name)}  ·  ${esc(s.layer || 'main')}</option>`).join('');
}
let who = '';
try { who = localStorage.getItem('vizrs.who') || ''; } catch { /* brak localStorage */ }
if (!who) { who = 'Operator ' + Math.floor(10 + Math.random() * 90); try { localStorage.setItem('vizrs.who', who); } catch { /* ignoruj */ } }
let lockedScene = null, lockedByOther = null;
async function lockScene(id) {
  if (lockedScene && lockedScene !== id) fetch(`/api/unlock/scenes/${encodeURIComponent(lockedScene)}?who=${encodeURIComponent(who)}`, { method: 'POST' }).catch(() => {});
  lockedScene = id; lockedByOther = null;
  try { await api('POST', `/api/lock/scenes/${encodeURIComponent(id)}?who=${encodeURIComponent(who)}`); }
  catch (e) { if (/^konflikt/.test(e.message)) { lockedByOther = e.message.replace(/^konflikt: edytuje /, '').replace(/ \(.*$/, ''); toast(`Scena jest edytowana przez ${lockedByOther} – zapis może zostać odrzucony`, true); } }
}
setInterval(() => { if (lockedScene && !lockedByOther) api('POST', `/api/lock/scenes/${encodeURIComponent(lockedScene)}?who=${encodeURIComponent(who)}`).catch(() => {}); }, 15000);
addEventListener('pagehide', () => { if (lockedScene && !lockedByOther) navigator.sendBeacon(`/api/unlock/scenes/${encodeURIComponent(lockedScene)}?who=${encodeURIComponent(who)}`); });
function openScene(s) {
  lockScene(s.id);
  scene = structuredClone(s);
  scene.nodes ||= []; scene.stops ||= []; scene.width ||= 1920; scene.height ||= 1080;
  if (!(scene.duration > 0)) scene.duration = 1;
  selId = null; selKey = null; t = 0; undo = []; redo = [];
  setDirty(false);
  player?.destroy();
  player = new ScenePlayer(stage, scene, {}, { editor: true });
  history.replaceState(null, '', '?scene=' + encodeURIComponent(s.id));
  resize(); renderAll();
  // jak w Viz: edycja zaczyna się w pierwszym stop poincie (grafika widoczna)
  setTime([...scene.stops].sort((a, b) => a - b)[0] ?? 0);
}
async function confirmLeave() {
  if (!dirty) return true;
  if (confirm('Scena ma niezapisane zmiany. Zapisać przed przejściem?')) { await save(); return true; }
  return confirm('Porzucić zmiany?');
}
async function save(force) {
  try {
    const body = force === true ? (({ rev, ...r }) => r)(scene) : scene; // bez rev = świadome nadpisanie
    const saved = await api('PUT', '/api/scenes/' + encodeURIComponent(scene.id), body);
    scene.rev = saved.rev;
    const i = scenes.findIndex((s) => s.id === saved.id);
    if (i >= 0) scenes[i] = saved; else scenes.push(saved);
    setDirty(false); renderSceneSel(); toast('Zapisano scenę „' + scene.name + '”');
  } catch (e) {
    if (/^konflikt/.test(e.message)) {
      if (confirm('Ta scena została zmieniona przez kogoś innego (lub w innym oknie).\n\nOK = nadpisz moją wersją, Anuluj = nie zapisuj.')) return save(true);
      toast('Konflikt zapisu – scena nie zapisana', true);
    } else toast('Błąd zapisu: ' + e.message, true);
  }
}
async function newScene(name, base) {
  const s = base || { name, layer: 'main', width: 1920, height: 1080, duration: 1, stops: [], nodes: [] };
  s.id = '';
  try {
    const saved = await api('POST', '/api/scenes', s);
    scenes.push(saved); renderSceneSel(); openScene(saved);
  } catch (e) { toast(e.message, true); }
}

/** Ruch jak w BTB CG (node.motion): presety IN/OUT, efekt tekstu, pętla uwagi – bez kluczy, liczone przez renderer. */
function motionForm(n) {
  const m = n.motion || {};
  const opt = (list, v, lab) => list.map((x) => `<option value="${x}" ${x === (v || 'none') ? 'selected' : ''}>${esc(lab ? lab(x) : x)}</option>`).join('');
  const numIn = (k, v, ph, step = 0.05) => `<input type="number" min="0" step="${step}" data-mo="${k}" value="${v ?? ''}" placeholder="${ph}">`;
  const phase = (k, label) => {
    const s = m[k] || {}, on = s.type && s.type !== '';
    let r = `<div class="mo"><label>${label}</label><select data-mo="${k}.type" style="grid-column:2/4"><option value="" ${on ? '' : 'selected'}>— bez presetu —</option>${opt(MO.ANIM_TYPES, on ? s.type : '-', (x) => MO.ANIM_LABELS[x] || x)}</select>`;
    if (on) {
      r += `<div class="sub"><label>czas s${numIn(k + '.dur', s.dur, '0.5')}</label><label>opóźnienie s${numIn(k + '.delay', s.delay, '0')}</label>
        <label>kierunek<select data-mo="${k}.dir" ${MO.DIR_TYPES.has(s.type) ? '' : 'disabled'}>${opt(MO.DIRECTIONS, s.dir || 'left', (x) => MO.DIR_LABELS[x])}</select></label></div>
        <div class="sub"><label style="grid-column:1/4">krzywa<select data-mo="${k}.ease">${opt(MO.MOTION_EASES, s.ease || 'power2.out')}</select></label></div>`;
    }
    return r + '</div>';
  };
  const textPhase = (k, label, list) => {
    const s = m[k] || {}, on = s.type && s.type !== 'none';
    let r = `<div class="mo"><label>${label}</label><select data-mo="${k}.type" style="grid-column:2/4">${opt(list, s.type || 'none', MO.textLabel)}</select>`;
    if (on) {
      r += `<div class="sub"><label>czas s${numIn(k + '.dur', s.dur, '0.5')}</label><label>opóźnienie s${numIn(k + '.delay', s.delay, '0')}</label>
        <label>odstęp s${numIn(k + '.stagger', s.stagger, 'auto', 0.01)}</label></div>
        <div class="sub"><label style="grid-column:1/4">kolejność<select data-mo="${k}.from">${opt(MO.STAGGER_FROM, s.from || 'start', (x) => ({ start: 'od początku', end: 'od końca', center: 'od środka', edges: 'od krawędzi' })[x])}</select></label></div>`;
    }
    return r + '</div>';
  };
  const lp = m.loop || {}, lpOn = lp.type && lp.type !== 'none';
  let h = `<div class="pgroup">Ruch (jak w BTB CG) – bez kluczy</div>` + phase('in', 'wejście') + phase('out', 'wyjście');
  if (n.type === 'text' || n.type === 'clock') h += textPhase('textIn', 'tekst IN', MO.TEXT_IN) + textPhase('textOut', 'tekst OUT', MO.TEXT_OUT);
  h += `<div class="mo"><label>pętla</label><select data-mo="loop.type" style="grid-column:2/4">${opt(MO.LOOP_TYPES, lp.type || 'none', (x) => MO.LOOP_LABELS[x])}</select>`;
  if (lpOn) h += `<div class="sub"><label>okres s${numIn('loop.dur', lp.dur, 'auto')}</label><label>siła${numIn('loop.amp', lp.amp, 'auto', 0.5)}</label>
    <label>kolor<input data-mo="loop.color" value="${esc(lp.color || '')}" placeholder="auto" ${['glow', 'shine', 'underline-sweep'].includes(lp.type) ? '' : 'disabled'}></label></div>`;
  h += '</div>';
  if (n.type === 'rect' || n.type === 'ellipse') h += `<div class="mo"><label title="Stały efekt tła (jak „efekt” kształtu w BTB) – gra cały czas, także w trakcie wejścia">efekt tła</label><select data-mobg style="grid-column:2/4">${opt(MO.BG_TYPES, m.bg || 'none', (x) => MO.BG_LABELS[x])}</select></div>`;
  const ORG = { '': 'środek', '0,0': 'lewy górny róg', '0.5,0': 'góra', '1,0': 'prawy górny róg', '0,0.5': 'lewa krawędź', '1,0.5': 'prawa krawędź', '0,1': 'lewy dolny róg', '0.5,1': 'dół', '1,1': 'prawy dolny róg' };
  const org = Array.isArray(m.origin) ? m.origin.join(',') : '';
  h += `<div class="mo"><label title="Punkt odniesienia skali i obrotu ruchu (presety przesłon, obrotu i odwróceń mają własny)">punkt ruchu</label><select data-moorg style="grid-column:2/4">${Object.entries(ORG).map(([k, v]) => `<option value="${k}" ${k === org ? 'selected' : ''}>${v}</option>`).join('')}${org && !ORG[org] ? `<option value="${org}" selected>${org}</option>` : ''}</select></div>`;
  const others = []; walk(scene.nodes, (x) => { if (x.id !== n.id) others.push(x); });
  h += `<div class="mo"><label title="Sekwencja: wejście zaczyna się, gdy skończy się wejście wskazanego węzła">po węźle</label><select data-moafter style="grid-column:2/4"><option value="">— od początku sceny —</option>${others.map((x) => `<option value="${esc(x.id)}" ${m.after === x.id ? 'selected' : ''}>${esc(x.name || x.id)}</option>`).join('')}</select></div>`;
  const hasOut = m.out?.type || (m.textOut?.type && m.textOut.type !== 'none');
  const st = sortedStops();
  if ((m.in?.type || hasOut || lpOn || (m.textIn?.type && m.textIn.type !== 'none')) && (!st.length || (hasOut && scene.duration < st[st.length - 1] + MO.outLen(m, n.props?.text) - 1e-3))) {
    h += `<div class="mohint">${!st.length ? 'Brak stop pointu: wyjście (OUT) zagra od ostatniego stopu, a pętla gra, gdy grafika stoi.' : 'Wyjście nie mieści się w długości sceny.'} <button data-mofit title="Stop point po wejściu i długość sceny = stop + wyjście">⟲ Dopasuj stop i długość</button></div>`;
  }
  return h;
}
/** Stop point po najdłuższym wejściu i długość sceny = stop + najdłuższe wyjście (ruch presetów i klucze). */
function fitMotionTiming() {
  const sh = MO.sequenceShifts(scene.nodes);
  let inE = 0, outL = 0, keyEnd = 0;
  walk(scene.nodes, (x) => {
    if (x.motion) { const tx = x.props?.text; inE = Math.max(inE, MO.inEnd(x.motion, sh.get(x.id) || 0, tx)); outL = Math.max(outL, MO.outLen(x.motion, tx)); }
    for (const tr of Object.values(x.anim || {})) for (const k of tr) keyEnd = Math.max(keyEnd, k.t);
  });
  checkpoint();
  const st = sortedStops();
  if (!st.length) scene.stops = [Math.round(Math.max(inE, 0.04) * 100) / 100];
  else if (st[st.length - 1] < inE) scene.stops = [...st.slice(0, -1), Math.round(inE * 100) / 100];
  const last = Math.max(...scene.stops);
  scene.duration = Math.round(Math.max(last + outL, last + 0.04, outL > 0 ? 0 : keyEnd) * 100) / 100;
  $('#dur').value = scene.duration;
  renderProps(); renderTimeline(); refresh();
}

const hex6 = (c) => { const p = parseColor(c); if (!p) return '#000000'; return '#' + p.slice(0, 3).map((x) => Math.round(x).toString(16).padStart(2, '0')).join(''); };

function syncProps(force) {
  const n = selNode(); if (!n) return;
  for (const inp of $$('[data-p]', $('#props'))) {
    const p = inp.dataset.p;
    if (!force && document.activeElement === inp) continue;
    let v = propAt(n, p, t, null);
    const d = PROPS[p];
    if (inp.type === 'checkbox') inp.checked = !!v;
    else if (d.t === 'num') inp.value = Math.round(v * 1000) / 1000;
    else {
      if (inp.tagName === 'SELECT' && v && ![...inp.options].some((o) => o.value === v)) inp.add(new Option(v, v));
      inp.value = v ?? '';
    }
  }
  for (const inp of $$('[data-pc]', $('#props'))) { const v = propAt(n, inp.dataset.pc, t, null); inp.value = hex6(v); }
  for (const b of $$('[data-key]', $('#props'))) {
    const tr = n.anim?.[b.dataset.key];
    b.classList.toggle('has', !!tr?.length);
    b.classList.toggle('on', !!tr?.some((k) => Math.abs(k.t - t) < 0.0005));
  }
  for (const b of $$('[data-field]', $('#props'))) {
    const f = n.fields?.[b.dataset.field];
    b.classList.toggle('on', !!f); b.title = f ? `Pole kontrolne: ${f} (kliknij, aby zmienić)` : 'Wystaw jako pole kontrolne (Control Object)';
  }
}

function renderSceneProps() {

const outStartOf = () => { const st = sortedStops(); const ls = st.length ? st[st.length - 1] : null; return ls !== null && scene.duration > ls + 1e-3 ? ls : Infinity; };

 (scene.markers || []).forEach((m, i) => { h += `<div class="mkm" data-mk="${i}" style="left:${m.t * pps}px" title="Marker „${esc(m.name || '')}” ${(+m.t).toFixed(2)}s – klik: skocz, dwuklik: zmień nazwę / usuń">◆<span>${esc(m.name || '')}</span></div>`; });

/** Oś w trybie sekwencji: wiersz na element, paski ruchu (presety) zamiast kluczy. */
function renderSeqTimeline() {
  const dur = scene.duration || 1;
  const W = Math.max(dur * pps + 80, $('#tl').clientWidth - LBL);
  const sh = MO.sequenceShifts(scene.nodes), oS = outStartOf();
  const rows = [];
  const visit = (list, depth) => { for (const n of list || []) { rows.push({ n, depth }); visit(n.children, depth + 1); } };
  visit(scene.nodes, 0);
  let h = `<div class="tl-in" style="width:${LBL + W}px">`;
  h += `<div class="tl-row ruler"><div class="tl-lbl"><span class="dim">sekwencja – ruch bez kluczy</span></div><div class="tl-area" data-area="ruler" style="width:${W}px">`;
  const step = pps > 500 ? 0.05 : pps > 160 ? 0.1 : 0.25, lab = pps > 500 ? 0.25 : 0.5;
  for (let i = 0; i * step <= dur + 1e-9 + 2; i++) {
    const s = i * step, major = Math.abs(s / lab - Math.round(s / lab)) < 1e-6;
    h += `<div class="tick ${major ? 'maj' : ''}" style="left:${s * pps}px">${major ? s.toFixed(2).replace(/0$/, '') : ''}</div>`;
  }
  scene.stops.forEach((s, i) => { h += `<div class="stopm" data-stop="${i}" style="left:${s * pps}px" title="Stop ${(+s).toFixed(2)}s – przeciągnij; dwuklik usuwa">▼</div>`; });
  h += `<div class="endm" style="left:${dur * pps}px" title="koniec sceny"></div></div></div>`;
  const bar = (id, sec, cls, a, b, label, title, handle = true) => `<div class="mb ${cls}" data-mb="${id}|${sec}" style="left:${a * pps}px;width:${Math.max(4, (b - a) * pps)}px" title="${esc(title)}">${esc(label)}${handle ? `<i class="mbh" data-mbh="${id}|${sec}"></i>` : ''}</div>`;
  for (const { n, depth } of rows) {
    const m = n.motion || {}, s0 = sh.get(n.id) || 0, tx = n.props?.text;
    const after = m.after && locate(m.after)?.node;
    const nk = Object.values(n.anim || {}).filter((tr) => tr?.length).length;
    h += `<div class="tl-row seq ${n.id === selId ? 'sel' : ''}"><div class="tl-lbl" data-sel="${n.id}" style="padding-left:${8 + depth * 12}px" title="${esc(n.name)}${after ? ` – wchodzi po „${esc(after.name)}”` : ''}">${TYPES[n.type]?.icon || ''} ${esc(n.name)}${after ? ` <span class="dim">↳ ${esc(after.name)}</span>` : ''}${nk ? ` <span class="dim" title="węzeł ma też klucze">◆${nk}</span>` : ''}</div><div class="tl-area" data-seqrow="${n.id}" style="width:${W}px">`;
    if (m.loop?.type && m.loop.type !== 'none') {
      const a = MO.inEnd(m, s0, tx), b = Number.isFinite(oS) ? oS : dur;
      if (b > a) h += bar(n.id, 'loop', 'loop', a, b, 'pętla: ' + (MO.LOOP_LABELS[m.loop.type] || m.loop.type), 'pętla uwagi – gra, gdy grafika stoi', false);
    }
    if (m.in?.type) {
      const a = s0 + MO.specDelay(m.in), d = m.in.type === 'none' ? 0 : MO.specDur(m.in);
      h += bar(n.id, 'in', 'in', a, a + d, MO.ANIM_LABELS[m.in.type] || m.in.type, `wejście: ${MO.ANIM_LABELS[m.in.type] || m.in.type} · start ${a.toFixed(2)} s · czas ${d.toFixed(2)} s – przeciągnij: opóźnienie, krawędź: czas`);
    }
    if (m.textIn?.type && m.textIn.type !== 'none') {
      const a = s0 + MO.specDelay(m.textIn), d = MO.specDur(m.textIn) + MO.textSpread(m.textIn, tx);
      h += bar(n.id, 'textIn', 'tin', a, a + d, '', `tekst IN: ${MO.textLabel(m.textIn.type)} · ${a.toFixed(2)}–${(a + d).toFixed(2)} s`);
    }
    if (Number.isFinite(oS)) {
      if (m.out?.type) {
        const a = oS + MO.specDelay(m.out), d = m.out.type === 'none' ? 0 : MO.specDur(m.out);
        h += bar(n.id, 'out', 'out', a, a + d, MO.ANIM_LABELS[m.out.type] || m.out.type, `wyjście: ${MO.ANIM_LABELS[m.out.type] || m.out.type} · start ${a.toFixed(2)} s · czas ${d.toFixed(2)} s`);
      }
      if (m.textOut?.type && m.textOut.type !== 'none') {
        const a = oS + MO.specDelay(m.textOut), d = MO.specDur(m.textOut) + MO.textSpread(m.textOut, tx);
        h += bar(n.id, 'textOut', 'tout', a, a + d, '', `tekst OUT: ${MO.textLabel(m.textOut.type)} · ${a.toFixed(2)}–${(a + d).toFixed(2)} s`);
      }
    }

  }
  scene.stops.forEach((s) => { h += `<div class="stopline" style="left:${LBL + s * pps}px"></div>`; });
  h += `<div class="endline" style="left:${LBL + dur * pps}px"></div>`;
  h += `<div id="playhead" style="left:${LBL + t * pps}px"></div></div>`;

/** Elementy, których dotyczą narzędzia sekwencji: dzieci zaznaczonej grupy, rodzeństwo zaznaczonego elementu albo scena. */
function seqTargets() {
  const n = selNode();
  if (n?.children?.length) return n.children;
  if (n) return locate(n.id).list;
  if (scene.nodes.length === 1 && scene.nodes[0].children?.length) return scene.nodes[0].children;
  return scene.nodes;
}
const r2 = (v) => Math.round(v * 100) / 100;
function seqTool(act) {
  const n = selNode();
  if (act === 'fit') return fitMotionTiming();
  if (act === 'stagger') {
    const step = Math.max(0, parseFloat($('#seqStep').value) || 0);
    let list = seqTargets();
    if (!list.length) return;
    checkpoint();
    const withIn = list.filter((x) => x.motion?.in?.type);
    if (!withIn.length) for (const x of list) (x.motion ||= {}).in = { type: 'fade', dur: 0.4, ease: 'power2.out' };
    list = list.filter((x) => x.motion?.in?.type);
    const base = MO.specDelay(list[0].motion.in);
    list.forEach((x, i) => { delete x.motion.after; x.motion.in.delay = r2(base + i * step); if (!x.motion.in.delay) delete x.motion.in.delay; });
    const outs = list.filter((x) => x.motion.out?.type);
    outs.forEach((x, i) => { const d = r2((outs.length - 1 - i) * step); if (d) x.motion.out.delay = d; else delete x.motion.out.delay; });
    toast(`Kaskada: ${list.length} elementów co ${step} s${outs.length ? ' (wyjścia odwrotnie)' : ''}`);
  } else if (act === 'chain') {
    const list = seqTargets().filter((x) => x.motion?.in?.type || x.motion?.textIn?.type);
    if (list.length < 2) return toast('Po kolei: potrzeba co najmniej dwóch elementów z ruchem wejścia', true);
    checkpoint();
    list.forEach((x, i) => { if (i) x.motion.after = list[i - 1].id; else delete x.motion.after; });
    toast(`Po kolei: ${list.length} elementów`);
  } else if (act === 'copy') {
    if (!n?.motion) return toast('Zaznacz element z ruchem do skopiowania', true);
    const list = locate(n.id).list.filter((x) => x !== n);
    if (!list.length || !confirm(`Skopiować ruch „${n.name}” na ${list.length} element(y) obok?`)) return;
    checkpoint();
    for (const x of list) {
      const m = structuredClone(n.motion); delete m.after;
      if (x.type !== 'text' && x.type !== 'clock') { delete m.textIn; delete m.textOut; }
      if (Object.keys(m).length) x.motion = m; else delete x.motion;
    }
    toast(`Skopiowano ruch na ${list.length} element(y)`);
  } else if (act === 'keys') {
    if (!n?.motion?.in && !n?.motion?.out) return toast('Zaznacz element z presetem wejścia lub wyjścia', true);
    const rest = {};
    for (const p of ['x', 'y', 'opacity', 'scale', 'skewX', 'blur', 'clipL', 'clipT', 'clipR', 'clipB']) rest[p] = +(n.props?.[p] ?? PROPS[p].d) || 0;
    const r = MO.motionToKeys(n.motion, { rest, outStart: outStartOf(), shift: MO.sequenceShifts(scene.nodes).get(n.id) || 0 });
    const clash = Object.keys(r.anim).filter((p) => n.anim?.[p]?.length);
    if (clash.length) return toast(`Na klucze: węzeł ma już klucze (${clash.join(', ')}) – usuń je albo zostań przy presecie`, true);
    if (!r.done.length) return showReport('Na klucze – nic nie zamieniono', r.skipped);
    checkpoint();
    n.anim = { ...(n.anim || {}), ...r.anim };
    for (const k of r.done) delete n.motion[k];
    if (!n.motion.textIn && !n.motion.textOut) delete n.motion.after;
    if (!Object.keys(n.motion).length) delete n.motion;
    seqMode = false; try { localStorage.setItem('vizrs.seq', '0'); } catch { /* ignoruj */ }
    if (r.skipped.length) showReport('Na klucze – część pominięta', r.skipped); else toast('Presety zamienione na klucze – widok kluczy');
  } else if (act === 'clear') {
    const list = n ? [n] : seqTargets();
    const withM = list.filter((x) => x.motion);
    if (!withM.length || !confirm(`Usunąć ruch (presety, pętle, efekty tekstu) z ${withM.length} element(ów)?`)) return;
    checkpoint();
    for (const x of withM) delete x.motion;
  }
  renderTimeline(); renderProps(); refresh();
}

function setProp(n, p, v) {
  const tr = n.anim?.[p];
  if (tr?.length && PROPS[p]?.anim) setKey(n, p, t, v);
  else { n.props ||= {}; n.props[p] = v; }
}
function setKey(n, p, at, v) {
  n.anim ||= {};

  else if (op === 'down' && i < list.length - 1) [list[i + 1], list[i]] = [list[i], list[i + 1]];
  else if (op === 'in' && i > 0 && TYPES[list[i - 1].type].children) {

function setZoom(v, anchorClientX) {

  const ar = host.getBoundingClientRect();
  const cx = anchorClientX != null ? anchorClientX - ar.left : ar.width / 2;
  const tAt = (host.scrollLeft + cx - LBL) / old;
  pps = Math.max(40, Math.min(1200, v));

  renderTimeline();
  host.scrollLeft = Math.max(0, tAt * pps + LBL - cx);
}
$('#tl').addEventListener('wheel', (e) => {

  setZoom(pps * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX);
}, { passive: false });
$('#zoomFit').onclick = () => { setZoom(($('#tl').clientWidth - LBL - 90) / Math.max(0.1, scene.duration)); $('#tl').scrollLeft = 0; };
function copyKeys() {

  if (!sel.length) return toast('Zaznacz klucze (kliknij, Shift+klik lub Shift+przeciągnięcie ramką)', true);
  const t0 = Math.min(...sel.map((x) => x.key.t));
  clipKeys = sel.map((x) => ({ prop: x.prop, dt: x.key.t - t0, v: x.key.v, e: x.key.e }));

function pasteKeys() {

  if (!n) return toast('Zaznacz węzeł, na który wkleić klucze', true);
  const ok = clipKeys.filter((c) => PROPS[c.prop]?.anim && TYPES[n.type].props.includes(c.prop));
  if (!ok.length) return toast(`Węzeł „${n.name}” nie ma tych właściwości`, true);
  checkpoint();
  for (const c of ok) {
    const at = Math.round(Math.max(0, Math.min(scene.duration, t + c.dt)) * 1000) / 1000;
    setKey(n, c.prop, at, c.v);
    const k = n.anim[c.prop].find((x) => Math.abs(x.t - at) < 0.0005); if (k && c.e) k.e = c.e;

$('#keyCopy').onclick = copyKeys;

// ------------------------------------------------------------ drzewo: przeciąganie (zmiana rodzica / kolejności)
const absPos = (id) => { let x = 0, y = 0, cur = locate(id); while (cur) { x += +cur.node.props?.x || 0; y += +cur.node.props?.y || 0; cur = cur.parent ? locate(cur.parent.id) : null; } return { x, y }; };
const isDesc = (anc, id) => { let f = false; walk(anc.children || [], (n) => { if (n.id === id) f = true; }); return f; };
function moveNode(srcId, dstId, mode) {
  const S = locate(srcId), D = dstId ? locate(dstId) : null; if (!S) return;
  if (D && (D.node.id === srcId || isDesc(S.node, D.node.id))) return toast('Nie można przenieść węzła do własnego potomka', true);
  if (mode === 'into' && !(D && TYPES[D.node.type].children)) return;
  checkpoint();
  const abs = absPos(srcId);
  S.list.splice(S.index, 1);
  const L = D ? locate(D.node.id) : null;
  let parent = null;
  if (mode === 'into') { (L.node.children ||= []).push(S.node); parent = L.node; }
  else if (L) { L.list.splice(L.index + 1, 0, S.node); parent = L.parent || null; }
  else scene.nodes.push(S.node);
  // zachowaj położenie na scenie: współrzędne względem nowego rodzica
  const pa = parent ? absPos(parent.id) : { x: 0, y: 0 };
  S.node.props ||= {}; S.node.props.x = Math.round(abs.x - pa.x); S.node.props.y = Math.round(abs.y - pa.y);
  player.setScene(scene); player.seek(t); renderTree(); renderProps(); renderTimeline();
}
let dragNode = null;
$('#tree').addEventListener('dragstart', (e) => { const it = e.target.closest('.item[data-id]'); if (!it || !it.dataset.id) { e.preventDefault(); return; } dragNode = it.dataset.id; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragNode); } catch { /* ignoruj */ } });
function dropMode(e, it) {
  const r = it.getBoundingClientRect(), n = locate(it.dataset.id)?.node;
  return n && TYPES[n.type].children && e.clientY > r.top + r.height * 0.25 && e.clientY < r.bottom - r.height * 0.25 ? 'into' : 'after';
}
$('#tree').addEventListener('dragover', (e) => {

  it.classList.add(it.dataset.id ? (dropMode(e, it) === 'into' ? 'dropinto' : 'dropafter') : 'dropafter');
});
$('#tree').addEventListener('dragend', () => { dragNode = null; $$('#tree .dropinto, #tree .dropafter').forEach((x) => x.classList.remove('dropinto', 'dropafter')); });
$('#tree').addEventListener('drop', (e) => {

  if (!it.dataset.id) { moveNode(src, null, 'after'); return; } // upuszczenie na wiersz sceny = na koniec korzenia
  moveNode(src, it.dataset.id, dropMode(e, it));

// ------------------------------------------------------------ biblioteka presetów animacji
let animPresets = [];
async function loadPresets() { animPresets = await api('GET', '/api/animpresets').catch(() => []); }
async function savePresets() { animPresets = await api('PUT', '/api/animpresets', animPresets); }
function presetFromNode(n, name) {
  const tracks = {}; let t0 = Infinity, t1 = 0;
  for (const [p, tr] of Object.entries(n.anim || {})) if (tr?.length) { tracks[p] = tr.map((k) => ({ ...k })); t0 = Math.min(t0, tr[0].t); t1 = Math.max(t1, tr[tr.length - 1].t); }
  if (!Object.keys(tracks).length) return null;
  for (const tr of Object.values(tracks)) tr.forEach((k) => { k.t = Math.round((k.t - t0) * 1000) / 1000; });
  return { id: uid('ap'), name, duration: Math.round((t1 - t0) * 1000) / 1000, tracks };
}
function applyPreset(n, pr) {
  let used = 0;
  for (const [p, tr] of Object.entries(pr.tracks || {})) {
    if (!PROPS[p]?.anim || !TYPES[n.type].props.includes(p)) continue;
    n.anim ||= {};
    const lo = t - 1e-4, hi = t + pr.duration + 1e-4;
    n.anim[p] = (n.anim[p] || []).filter((k) => k.t < lo || k.t > hi).concat(tr.map((k) => ({ ...k, t: Math.round((k.t + t) * 1000) / 1000 })));
    n.anim[p].sort((a, b) => a.t - b.t); used++;
  }
  return used;
}
$('#props').addEventListener('click', async (e) => {

  try {
    if (act === 'save') {
      const name = prompt('Nazwa presetu animacji', n.name + ' – animacja'); if (!name) return;
      const pr = presetFromNode(n, name);
      if (!pr) return toast('Węzeł nie ma kluczy animacji', true);
      animPresets.push(pr); await savePresets(); renderProps(); toast(`Zapisano preset „${name}”`);
    } else {
      const sel = $('#apSel')?.value, pr = animPresets.find((x) => x.id === sel);
      if (act === 'apply') {
        if (!pr) return toast('Wybierz preset', true);
        checkpoint(); const used = applyPreset(n, pr);
        if (!used) { undo.pop(); return toast('Ten węzeł nie ma właściwości z presetu', true); }
        player.setScene(scene); player.seek(t); renderTimeline(); renderTree(); syncProps(); toast(`Zastosowano preset „${pr.name}” od ${t.toFixed(2)}s`);
      } else if (act === 'del') {
        if (!pr || !confirm(`Usunąć preset „${pr.name}”?`)) return;
        animPresets = animPresets.filter((x) => x.id !== pr.id); await savePresets(); renderProps();
      } else if (act === 'export') {
        if (!pr) return toast('Wybierz preset', true);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(pr, null, 2)], { type: 'application/json' }));
        a.download = (pr.name || 'preset').replace(/[^\w.\-]+/g, '_') + '.animpreset.json'; a.click();
      } else if (act === 'import') {

        fi.onchange = async () => {
          try { const x = JSON.parse(await fi.files[0].text()); if (!x.tracks) throw new Error('to nie jest preset animacji'); x.id = uid('ap'); animPresets.push(x); await savePresets(); renderProps(); toast('Zaimportowano preset'); }
          catch (err) { toast('Import: ' + err.message, true); }

      }
    }
  } catch (err) { toast(err.message, true); }
});
loadPresets();

// ------------------------------------------------------------ górny pasek
$('#sceneSel').addEventListener('change', async (e) => {
  const s = scenes.find((s) => s.id === e.target.value);
  if (await confirmLeave()) openScene(s); else renderSceneSel();
});
$('#bSave').onclick = save;
$('#bUndo').onclick = doUndo;
$('#bRedo').onclick = doRedo;
$('#bNew').onclick = async () => {
  if (!(await confirmLeave())) return;
  const n = prompt('Nazwa nowej sceny', 'Scena' + (scenes.length + 1)); if (!n) return;
  newScene(n);
};
$('#bDup').onclick = async () => {
  if (!(await confirmLeave())) return;
  const c = structuredClone(scene); c.name += ' kopia'; newScene(null, c);
};
$('#bDel').onclick = async () => {
  if (!confirm(`Usunąć scenę „${scene.name}”?\nStrony w Trio korzystające z tego szablonu też zostaną usunięte.`)) return;
  try {
    await api('DELETE', '/api/scenes/' + encodeURIComponent(scene.id));
    scenes = scenes.filter((s) => s.id !== scene.id); setDirty(false);
    if (scenes.length) openScene(scenes[0]); else newScene('Nowa scena');
  } catch (e) { toast(e.message, true); }
};
$('#bExp').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(scene, null, 2)], { type: 'application/json' }));
  a.download = (scene.name || 'scena').replace(/[^\w.\-]+/g, '_') + '.vizrs.json'; a.click();
};
$('#bImp').onclick = () => {
  const fi = $('#fileIn'); fi.accept = '.json,.cgpack,application/json,application/zip'; fi.value = '';
  fi.onchange = async () => {
    const f = fi.files[0]; if (!f) return;
    try {
      if (/\.cgpack$/i.test(f.name)) {
        const u8 = new Uint8Array(await f.arrayBuffer());
        const kind = await PACK.packKind(u8);
        if (kind === 'btb') return importBtbFile(f);
        if (!kind) throw new Error('to nie jest paczka .cgpack');
        return importPack(u8);
      }
      const s = JSON.parse(await f.text()); if (!Array.isArray(s.nodes)) throw new Error('to nie jest scena VizRS'); if (await confirmLeave()) newScene(null, s);
    } catch (e) { toast('Import: ' + e.message, true); }
  };
  fi.click();
};

// ------------------------------------------------------------ paczka belek (.cgpack)
const fetchAssetBytes = async (name) => {
  const r = await fetch('/assets/' + encodeURIComponent(name));
  if (!r.ok) throw new Error(String(r.status));
  return new Uint8Array(await r.arrayBuffer());
};
async function uploadBytes(name, data) {
  const r = await fetch('/api/assets?name=' + encodeURIComponent(name), { method: 'POST', body: data });
  if (!r.ok) throw new Error(`${name}: ${(await r.json().catch(() => ({}))).error || r.status}`);
}
$('#bPack').onclick = async () => {
  let show;
  try { show = await api('GET', '/api/show'); } catch (e) { return toast(e.message, true); }
  await loadAssets();
  const known = assets.map((a) => a.name);
  const list = show.scenes.map((s) => (scene && s.id === scene.id ? scene : s)); // bieżąca scena w wersji z edytora
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2000;display:flex;align-items:center;justify-content:center';
  d.innerHTML = `<div style="width:min(720px,94vw);max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px">
    <b style="font-size:15px">Paczka belek (.cgpack)</b>
    <div class="dim" style="margin:4px 0 10px;font-size:12px">Sceny razem z grafikami i czcionkami, których używają (oraz dołączonymi w „Zasoby paczki”). Czcionki z paczki serwer wysyła na /output – komputer z OBS nie musi ich mieć.</div>
    <div class="row" style="gap:6px;margin-bottom:6px"><button data-pk="all">zaznacz wszystkie</button><button data-pk="none">żadna</button><span class="grow"></span><label><input type="checkbox" id="pkPages" checked> dołącz strony z Trio</label></div>
    <div id="pkList" style="max-height:38vh;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px 8px">${list.map((s) => `<label style="display:flex;gap:8px;align-items:center;padding:2px 0"><input type="checkbox" value="${esc(s.id)}" ${scene && s.id === scene.id ? 'checked' : ''}><span class="grow">${esc(s.name)}</span><span class="dim" style="font-size:11px">${PACK.sceneAssets(s, known).length} plik(ów)</span></label>`).join('')}</div>
    <div id="pkSum" class="dim" style="margin:8px 0;font-size:12px"></div>
    ${dirty ? '<div style="color:var(--warn,#e8b04b);font-size:12px;margin-bottom:6px">Bieżąca scena ma niezapisane zmiany – trafią do paczki w wersji z edytora.</div>' : ''}
    <div class="row" style="gap:6px"><button id="pkGo" class="acc">⇩ Pobierz .cgpack</button><button id="pkNo">Anuluj</button></div></div>`;
  document.body.appendChild(d);
  const chosen = () => $$('#pkList input:checked', d).map((i) => list.find((s) => s.id === i.value)).filter(Boolean);
  const sum = () => {
    const sc = chosen(), files = new Set(); sc.forEach((s) => PACK.sceneAssets(s, known).forEach((n) => files.add(n)));
    const fonts = [...files].filter((n) => PACK.FONT_RE.test(n));
    $('#pkSum', d).innerHTML = `${sc.length} scen · ${files.size - fonts.length} grafik · ${fonts.length} czcionek${fonts.length ? ': ' + fonts.map(esc).join(', ') : ''}`;
  };
  sum();
  d.addEventListener('change', sum);
  d.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-pk]');
    if (b) { $$('#pkList input', d).forEach((i) => (i.checked = b.dataset.pk === 'all')); sum(); return; }
    if (e.target.id === 'pkNo' || e.target === d) { d.remove(); return; }
    if (e.target.id !== 'pkGo') return;
    const sc = chosen(); if (!sc.length) return toast('Zaznacz co najmniej jedną scenę', true);
    e.target.disabled = true;
    try {
      const { blob, missing, assets: packed } = await PACK.buildPack({
        scenes: sc, pages: $('#pkPages', d).checked ? show.pages : [], known, fetchAsset: fetchAssetBytes, generator: 'VizRS Artist',
      });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (sc.length === 1 ? sc[0].name || 'scena' : 'belki').replace(/[^\w.\-]+/g, '_') + '.cgpack'; a.click();
      d.remove();
      toast(`Paczka: ${sc.length} scen, ${packed.length} plików (${(blob.size / 1024).toFixed(0)} KB)`);
      if (missing.length) showReport('Paczka utworzona – brakujące pliki', missing.map((n) => `nie udało się odczytać ${n}`));
    } catch (err) { toast('Paczka: ' + err.message, true); e.target.disabled = false; }
  });
};
async function importPack(u8) {
  const pk = await PACK.readPack(u8);
  if (!(await confirmLeave())) return;
  await loadAssets();
  const report = [];
  const { map, uploaded, skipped } = await PACK.installAssets(pk.assets, { existing: assets.map((a) => a.name), fetchAsset: fetchAssetBytes, upload: uploadBytes });
  for (const [a, b] of map) report.push(`plik ${a} istniał z inną treścią – zapisano jako ${b}`);
  const scenesIn = PACK.renameAssets(pk.scenes, map), pagesIn = PACK.renameAssets(pk.pages, map);
  const ids = new Map(); let last = null;
  for (const s of scenesIn) {
    const { id, rev, ...body } = s; // eslint-disable-line no-unused-vars
    if (scenes.some((x) => x.name === body.name)) report.push(`scena „${body.name}” już istnieje – dodano jako kopię`);
    try { const saved = await api('POST', '/api/scenes', body); scenes.push(saved); ids.set(id, saved.id); last = saved; }
    catch (e) { report.push(`scena „${body.name}”: ${e.message}`); }
  }
  let pages = 0;
  for (const p of pagesIn) {
    const sid = ids.get(p.scene); if (!sid) continue;
    const { id, rev, ...body } = p; // eslint-disable-line no-unused-vars
    body.scene = sid;
    try { await api('POST', '/api/pages', body); pages++; }
    catch (e) {
      if (/zajęty/.test(e.message)) { delete body.number; try { await api('POST', '/api/pages', body); pages++; report.push(`strona ${p.number} „${p.name || ''}”: numer zajęty – nadano nowy`); } catch (e2) { report.push(`strona ${p.number}: ${e2.message}`); } }
      else report.push(`strona ${p.number}: ${e.message}`);
    }
  }
  await loadAssets();
  if (last) openScene(last);
  const fonts = uploaded.filter((n) => PACK.FONT_RE.test(n));
  showReport(`Zaimportowano paczkę: ${ids.size} scen, ${pages} stron, ${uploaded.length} nowych plików${fonts.length ? ` (czcionki: ${fonts.join(', ')})` : ''}${skipped.length ? `, ${skipped.length} plików już było` : ''}`, report);
}

// ------------------------------------------------------------ BTB CG: import elementów
function showReport(title, lines) {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2000;display:flex;align-items:center;justify-content:center';
  d.innerHTML = `<div style="width:min(720px,94vw);max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px">
    <b style="font-size:15px">${esc(title)}</b>
    <ul id="rep" style="margin:10px 0;padding-left:18px;line-height:1.5">${lines.map((l) => `<li>${esc(l)}</li>`).join('') || '<li class="dim">Bez uwag – wszystko przeniesiono.</li>'}</ul>
    <button id="repOk" class="acc">OK</button></div>`;
  document.body.appendChild(d);
  d.querySelector('#repOk').onclick = () => d.remove();
  d.addEventListener('mousedown', (e) => { if (e.target === d) d.remove(); });
}
$('#bImpBtb').onclick = () => {
  const fi = $('#fileIn'); fi.accept = '.json,.cgpack,application/json,application/zip'; fi.value = '';
  fi.onchange = () => { if (fi.files[0]) importBtbFile(fi.files[0]); };
  fi.click();
};
async function importBtbFile(f) {
  try {
    if (!(await confirmLeave())) return;
    const isZip = /\.cgpack$/i.test(f.name);
    const { elements, files } = await BTB.readBtb(isZip ? new Uint8Array(await f.arrayBuffer()) : await f.text(), f.name);
    const report = []; let made = 0, last = null;
    for (const el of elements) {
      const used = new Set();
      const r = BTB.convertElement(el, {
        knownFonts: [...FONTS, 'Oswald', 'Barlow Condensed', 'Inter', 'Roboto Condensed', 'Montserrat', 'Roboto'],
        assetName: (src) => { const k = Object.keys(files || {}).find((n) => n === src || n === src.replace(/^\//, '')); if (!k) return null; used.add(k); return k.split('/').pop(); },
      });
      for (const k of used) {
        const rr = await fetch('/api/assets?name=' + encodeURIComponent(k.split('/').pop()), { method: 'POST', body: files[k] });
        if (!rr.ok) r.warnings.push(`plik ${k}: ${(await rr.json().catch(() => ({}))).error || rr.status}`);
      }
      const saved = await api('POST', '/api/scenes', r.scene);
      scenes.push(saved);
      await api('POST', '/api/pages', { scene: saved.id, name: r.page.name, values: r.page.values }).catch((e) => r.warnings.push('strona nie utworzona: ' + e.message));
      r.warnings.forEach((w) => report.push(`${r.scene.name}: ${w}`));
      made++; last = saved;
    }
    await loadAssets();
    if (last) openScene(last);
    showReport(`Zaimportowano ${made} ${made === 1 ? 'element' : 'elementy'} z BTB CG`, report);
  } catch (e) { toast('Import BTB: ' + e.message, true); }
}

// ------------------------------------------------------------ klawiatura
addEventListener('keydown', (e) => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); save(); return; }
  if (typing) return;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); return; }
  if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); doRedo(); return; }
  if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); treeOp('dup'); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); if (lastArea === 'timeline' && selKey) deleteSelKey(); else treeOp('del'); return; }
  if (e.key === ' ') { e.preventDefault(); if (player.playing) player.playing = false; else $('#pPlay').click(); return; }
  if (mod && e.key.toLowerCase() === 'c' && lastArea === 'timeline') { e.preventDefault(); copyKeys(); return; }
  if (mod && e.key.toLowerCase() === 'v' && lastArea === 'timeline') { e.preventDefault(); pasteKeys(); return; }
  if (e.key.toLowerCase() === 'm' && !mod) { e.preventDefault(); addMarker(t); return; }
  if (e.key === 'Home') { setTime(0); return; }
  if (e.key === 'End') { setTime(scene.duration); return; }
  const n = selNode();
  const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (n && arrows[e.key]) {
    e.preventDefault(); checkpoint();
    const m = e.shiftKey ? 10 : 1, [dx, dy] = arrows[e.key];
    setProp(n, 'x', propAt(n, 'x', t, null) + dx * m); setProp(n, 'y', propAt(n, 'y', t, null) + dy * m);
    refresh(); syncProps();
  }
});
addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

// pętla UI: śledzenie odtwarzania i ramki zaznaczenia
let lastSync = 0;
(function frame(now) {
  if (player) {
    if (player.playing || Math.abs(player.t - t) > 1e-6) {
      t = player.t; updatePlayhead();
      if (now - lastSync > 80) { syncProps(); lastSync = now; }
    }
    updateSel();
  }
  requestAnimationFrame(frame);
})(0);

new ResizeObserver(() => resize()).observe(box);
load().catch((e) => toast('Błąd: ' + e.message, true));

// ------------------------------------------------------------ pasek stanu: podpowiedź do panelu pod kursorem
const HINT0 = 'Ctrl+S zapisz · Ctrl+Z / Ctrl+Y cofnij / ponów · najedź na panel, aby zobaczyć jego skróty';
$('#hint').textContent = HINT0;
document.addEventListener('mouseover', (e) => { const h = e.target.closest?.('[data-hint]')?.dataset.hint || HINT0; if ($('#hint').textContent !== h) $('#hint').textContent = h; });

// ------------------------------------------------------------ rozdzielacze paneli (rozmiary zapamiętane w przeglądarce/oknie)
const LAY = { l: [270, 170, 560], r: [350, 260, 680], t: [260, 120, 640] }; // domyślnie, min, max
const lay = (() => { try { return JSON.parse(localStorage.getItem('vizrs.artistLayout')) || {}; } catch { return {}; } })();
const setLay = (k, v) => { const [, lo, hi] = LAY[k]; lay[k] = Math.round(Math.max(lo, Math.min(hi, v))); $('#main').style.setProperty('--' + k, lay[k] + 'px'); };
const saveLay = () => { try { localStorage.setItem('vizrs.artistLayout', JSON.stringify(lay)); } catch { /* brak localStorage */ } renderTimeline(); };
for (const k of Object.keys(LAY)) setLay(k, +lay[k] || LAY[k][0]);
for (const g of document.querySelectorAll('.gutter')) {
  const k = g.dataset.k;
  g.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    g.setPointerCapture(e.pointerId); g.classList.add('drag');
    const start = lay[k], x0 = e.clientX, y0 = e.clientY;
    const move = (ev) => setLay(k, start + (k === 'l' ? ev.clientX - x0 : k === 'r' ? x0 - ev.clientX : y0 - ev.clientY));
    const up = () => { g.removeEventListener('pointermove', move); g.removeEventListener('pointerup', up); g.classList.remove('drag'); saveLay(); };
    g.addEventListener('pointermove', move); g.addEventListener('pointerup', up);
  });
  g.addEventListener('dblclick', () => { setLay(k, LAY[k][0]); saveLay(); });
}

// okno natywne: bez przeglądarkowego menu pod prawym przyciskiem (Wstecz/Odśwież…); w polach tekstowych zostaje (kopiuj, wklej, pisownia)
if (document.documentElement.classList.contains('native')) {
  addEventListener('contextmenu', (e) => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
}
