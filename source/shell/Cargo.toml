# vizrs-shell – natywne okno VizRS Trio i wyjścia na Tauri 2 (WebView systemowy: WebView2 / WebKitGTK / WKWebView).
#
# Osobny workspace z własnym Cargo.lock: rdzeń `vizrs` (../Cargo.toml) zostaje BEZ zależności,
# a obraz Docker i jego CI nie widzą tego katalogu. Okno nie wkompilowuje serwera – uruchamia
# `vizrs serve` jako osobny proces (awaria okna nie zdejmuje anteny) albo dołącza do działającego.
#
# Dozwolone zależności (wyjątek od zasady „zero zależności” tylko w tym katalogu; te same co VizRS CG Artist,
# decyzja użytkownika 2026-11-12, plan PLAN-wyglad-live-i-tauri.md T1):
#   tauri (okna, WebView, menu), tauri-plugin-dialog (okna dialogowe, „Zapisz jako”),
#   tauri-plugin-single-instance (jedna instancja), serde_json (blokada katalogu danych, komunikaty mostu),
#   webkit2gtk (tylko Linux, już zależność Tauri: pisownia polska, akceleracja GPU stron); tauri-build przy budowie.
[package]
name = "vizrs-shell"
version = "26.11.2"
edition = "2021"
description = "Natywne okno VizRS Trio (Tauri 2)"
repository = "https://github.com/sdorpl/VizRS-CG-System"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"

# Linux: ustawienia WebKitGTK (pisownia polska, akceleracja); ta sama wersja, której używa Tauri – nic nowego do pobrania
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
