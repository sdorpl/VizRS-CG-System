# Przykład: nginx jako reverse proxy z HTTPS przed VizRS (zamiast Caddy).
# VizRS uruchomiony lokalnie: vizrs --bind 127.0.0.1 --port 8088 --tcp 0 (token w VIZRS_TOKEN).
# Certyfikat np. z certbot (`certbot --nginx -d cg.example.pl`).

server {
    listen 443 ssl;
    http2 on;
    server_name cg.example.pl;

    ssl_certificate     /etc/letsencrypt/live/cg.example.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cg.example.pl/privkey.pem;

    # paczki .cgpack i grafiki (limit VizRS: 64 MB na żądanie)
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        # wymagane: VizRS porównuje Origin z Host (ochrona przed obcymi witrynami)
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        # SSE (/events): bez buforowania i z długim czasem odczytu
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}

server {
    listen 80;
    server_name cg.example.pl;
    return 301 https://$host$request_uri;
}
